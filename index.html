<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAFAF7; --line:#E6E4DD; --line-2:#D9D6CC;
  --ink:#18181A; --ink-2:#3A3A3E; --muted:#7A786F; --faint:#A9A69B;
  --accent:#F2C230; --accent-ink:#5C4500; --accent-soft:#FDF4D3;
  --side:#161618; --side-2:#232326; --side-ink:#ECEAE3; --side-muted:#8E8C84;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B26A00; --warn-soft:#FBEBD2; --bad:#B23A2E; --bad-soft:#F7E0DC; --info:#2D5C8A; --info-soft:#E1EAF3;
  --c-init:#9A988F; --c-inter:#F2C230; --c-final:#18181A;
  --r:10px; --r-sm:7px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid #2b2b2f}
.brand-mark{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#161618;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.5px}
.brand-name{font-weight:800;letter-spacing:.06em;font-size:12.5px;line-height:1.15}
.brand-name span{display:block;color:var(--side-muted);font-weight:600;letter-spacing:.14em;font-size:10px}
.side-sec{padding:14px 12px 4px}
.side-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:0 8px 6px;font-weight:700}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:transparent;border-radius:7px;color:var(--side-ink);cursor:pointer;text-align:left;font-size:13.5px;font-weight:500}
.nav-btn:hover{background:var(--side-2)}
.nav-btn.on{background:var(--side-2);color:#fff}
.nav-btn.on .ico{color:var(--accent)}
.nav-btn[disabled]{opacity:.38;cursor:not-allowed}
.nav-btn .ico{width:16px;height:16px;color:var(--side-muted);flex:none}
.nav-btn .tag{margin-left:auto;font-size:10px;color:var(--side-muted);font-family:"JetBrains Mono",monospace}
.pt-switch{margin:12px 12px 0;padding:10px;border-radius:9px;background:var(--side-2);border:1px solid #303034}
.pt-switch select{width:100%;background:#161618;border:1px solid #3a3a3f;border-radius:6px;padding:6px 8px;color:var(--side-ink);font-size:13px}
.pt-switch .pt-name{font-weight:700;font-size:13.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side-foot{margin-top:auto;padding:14px 20px;font-size:11px;color:var(--side-muted);border-top:1px solid #2b2b2f}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
/* Main */
.main{overflow:auto;display:flex;flex-direction:column}
.topbar{flex:none;position:sticky;top:0;z-index:5;background:rgba(244,243,239,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;min-height:64px}
.crumbs{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.title small{font-weight:600;color:var(--muted);font-size:14px;letter-spacing:0}
.topbar .grow{flex:1}
.content{padding:24px 28px 60px;max-width:1440px;width:100%}
/* Cards */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.bil-grid{grid-template-columns:1fr !important}}
@media (max-width:820px){.bc-edit{grid-template-columns:1fr !important}}
@media (max-width:1100px){.se-grid{grid-template-columns:1fr !important}}
.mob-only{display:none !important}.mtabs{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}.g2,.g3,.g4{grid-template-columns:1fr}
  .side{position:fixed;top:0;left:0;bottom:0;width:272px;z-index:45;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .app.menu-open .side{transform:none}

<script>
(function(){
const {useState,useEffect,useMemo,useRef,useCallback,Fragment}=React;
const html=htm.bind(React.createElement);

/* =========================================================

   ========================================================= */
const APP_VERSION="0.9.3";
const SECURE=!!window.BPPS_SECURE;
const STORE_KEY="bpps_store_v1";
const STATUTS_PATIENT=["Actif","En pause","Terminé","Archivé"];
const PRIORITES=["Prioritaire","Haute","Normale","Basse"];
const TODAY=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const DEFAULT_SETTINGS={
  douleur:{wRepos:0.25,wActivite:0.5,wNuit:0.25},
  mobGenou:{wFlex:0.5,wExt:0.5,ptsParDegreExt:10,flexRef:140,extRef:0,useActive:true},

/* =========================================================

   ========================================================= */
const pad=(n,l=4)=>String(n).padStart(l,"0");
const parseD=s=>{if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d};

const daysBetween=(a,b)=>Math.round((b-a)/86400000);
const age=dob=>{const d=parseD(dob);if(!d)return null;const t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a};
const num=v=>{if(v===""||v===null||v===undefined)return null;const n=Number(String(v).replace(",",".").trim());return isNaN(n)?null:n};
const r1=v=>v===null||v===undefined?null:Math.round(v*10)/10;
const r0=v=>v===null||v===undefined?null:Math.round(v);
const mean=arr=>{const a=arr.filter(v=>v!==null&&v!==undefined&&!isNaN(v));return a.length?a.reduce((s,v)=>s+v,0)/a.length:null};
const clamp=(v,lo=0,hi=100)=>v===null?null:Math.max(lo,Math.min(hi,v));
const nowISO=()=>new Date().toISOString();
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2)};
const sideLabel=c=>({D:"Droit",G:"Gauche",B:"Bilatéral"}[c]||"—");
const fullName=p=>p?`${p.prenom||""} ${(p.nom||"").toUpperCase()}`.trim():"";
const statusCls=s=>({"Actif":"p-actif","En pause":"p-pause","Terminé":"p-termine","Archivé":"p-archive"}[s]||"p-archive");
const prioCls=p=>({"Prioritaire":"p-prio","Haute":"p-haute","Normale":"p-normale","Basse":"p-basse"}[p]||"p-basse");
const prioRank=p=>({"Prioritaire":0,"Haute":1,"Normale":2,"Basse":3}[p]??4);

/* =========================================================
   CALCULS CLINIQUES (méthodes explicites, paramétrables)
   ========================================================= */
// Score douleur /100 — indicateur interne, non validé. null si une EVA manque.
function painScore(dl,S){
  const r=num(dl?.evaRepos),a=num(dl?.evaActivite),n=num(dl?.evaNuit);
  if(r===null||a===null||n===null) return null;
  const w=S.douleur; return clamp(100-((r*w.wRepos+a*w.wActivite+n*w.wNuit)*10));
}
const lsi=(les,sain)=>{const l=num(les),s=num(sain);if(l===null||s===null||s===0)return null;return l/s*100};
const otherSide=c=>c==="D"?"G":c==="G"?"D":null;

// Mobilité genou : flexion = ratio lésé/controlatéral ; extension = perte en degrés vs controlatéral
// (hyperextension physiologique incluse dans la référence), pénalité X pts/°.
function kneeMobility(b,S){
  const m=b.mobilite||{},s=S.mobGenou,les=b.cote,ref=otherSide(les),k=s.useActive?"A":"P";
  if(!les) return {score:null};
  const sides=les==="B"?["D","G"]:[les];
  const out={flex:[],ext:[]};
  sides.forEach(sd=>{
    const fL=num(m[`flex${k}_${sd}`]), eL=num(m[`ext${k}_${sd}`]);
    const fR=ref?num(m[`flex${k}_${ref}`]):s.flexRef, eR=ref?num(m[`ext${k}_${ref}`]):s.extRef;
    if(fL!==null&&fR!==null){const def=Math.max(0,fR-fL);out.flex.push({def,score:clamp(fL/fR*100)})}

  });
  const fs=mean(out.flex.map(x=>x.score)),es=mean(out.ext.map(x=>x.score));
  const defFlex=mean(out.flex.map(x=>x.def)),defExt=mean(out.ext.map(x=>x.def));
  let score=null;
  if(fs!==null&&es!==null) score=fs*s.wFlex+es*s.wExt; else if(fs!==null) score=fs; else if(es!==null) score=es;
  return {score:clamp(score),flexScore:fs,extScore:es,defFlex,defExt,partial:(fs===null)!==(es===null)};
}
const ANK_AMPL=[["fd","Flexion dorsale"],["fp","Flexion plantaire"],["ev","Éversion"],["inv","Inversion"]];
function ankleMobility(b,S){
  const m=b.mobilite||{},les=b.cote,ref=otherSide(les);
  if(!les)return {score:null};
  const L=les==="B"?mean([num(m.ktw_D),num(m.ktw_G)]):num(m[`ktw_${les}`]);
  const R=ref?num(m[`ktw_${ref}`]):S.mobCheville.ktwRef;
  const wblt=L!==null&&R!==null&&R>0?Math.min(100,L/R*100):null;
  const def=L!==null&&R!==null?Math.max(0,R-L):null;
  const ratios={};
  if(les!=="B")ANK_AMPL.forEach(([k])=>{const pick=sd=>{const a=num(m[`${k}A_${sd}`]);return a!==null?a:num(m[`${k}P_${sd}`])};const a=pick(les),r=pick(ref);ratios[k]=a!==null&&r!==null&&r>0?Math.min(100,a/r*100):null});
  const sc=mean([wblt,...Object.values(ratios)]);
  return {score:sc===null?null:clamp(sc),def,wblt,ratios,defFD:(()=>{if(les==="B")return null;const pick=sd=>{const a=num(m[`fdA_${sd}`]);return a!==null?a:num(m[`fdP_${sd}`])};const a=pick(les),r=pick(ref);return a!==null&&r!==null?Math.max(0,r-a):null})()};
}
function lsiPair(obj,key,cote){
  if(!obj||!cote||cote==="B")return null;
  return lsi(obj[`${key}_${cote}`],obj[`${key}_${otherSide(cote)}`]);
}
// Région : chaque domaine renvoie une valeur 0–100 (100 = meilleur état) ou null si non évalué.
const REGIONS={
  genou:{
    label:"Genou",
    compute(b,S){
      const mob=kneeMobility(b,S);
      const f=b.force||{},fn=b.fonction||{},q=b.questionnaires||{};
      const lq=lsiPair(f,"quad",b.cote),li=lsiPair(f,"ischio",b.cote);
      const force=mean([lq,li].map(v=>v===null?null:Math.min(S.capLSI,v)));
      const hopL={};HOPS.forEach(([k,,,inv])=>{const v=lsiPair(fn,k,b.cote);hopL["lsiHop_"+k]=v===null?null:(inv?10000/v:v)});
      const sc=b.cote&&b.cote!=="B"?[sebtComposite(fn,b.cote),sebtComposite(fn,otherSide(b.cote))]:[null,null];
      const ls=sc[0]&&sc[1]&&sc[1].v?sc[0].v/sc[1].v*100:null;
      const fonction=mean([...Object.values(hopL),ls].map(v=>v===null?null:Math.min(S.capLSI,v)));
      const pm=psfsMean(b.psfs);const qs=[num(q.ikdc),num(q.koos),num(q.aclrsi),num(q.lysholm),num(q.visaP),num(q.sane),pm===null?null:pm*10];
      const hq=(()=>{const c=b.cote;if(!c||c==="B")return null;const iq=num(f[`ischio_${c}`]),qq=num(f[`quad_${c}`]);return iq!==null&&qq?iq/qq:null})();
      return {douleur:painScore(b.douleur,S),mobilite:mob.score,force:clamp(force),fonction:clamp(fonction),questionnaire:clamp(mean(qs)),
        detail:{mob,lsiQuad:lq,lsiIschio:li,lsiSebt:ls,hq,...hopL,lsiSingle:hopL.lsiHop_singleHop,lsiTriple:hopL.lsiHop_tripleHop}};
    },
    methods:{
      douleur:"100 − [(EVA repos × wR + EVA activité × wA + EVA nuit × wN) × 10]. Calculé seulement si les 3 EVA sont renseignées.",
      mobilite:"Flexion : (lésé / controlatéral) × 100. Extension : 100 − (perte en ° vs controlatéral × pts/°), l'hyperextension du côté sain sert de référence. Score = wF × flexion + wE × extension. Si les deux côtés sont atteints : normes paramétrables.",
      force:"Moyenne des LSI quadriceps et ischio-jambiers (lésé / sain × 100), plafonnés à 100.",
      fonction:"Moyenne des LSI disponibles (plafonnés à 100) : hop tests (single, triple, crossover ; timed hop et figure of 8 en sain / lésé) et SEBT composite.",
      questionnaire:"Moyenne des scores /100 disponibles : IKDC, KOOS4, ACL-RSI, Lysholm, VISA-P, SANE, PSFS (moyenne × 10)."
    }
  },
  cheville:{
    label:"Cheville / pied",
    compute(b,S){
      const mob=ankleMobility(b,S);
      const f=b.force||{},fn=b.fonction||{},q=b.questionnaires||{};const cap=v=>v===null?null:Math.min(S.capLSI,v);
      const lhr=lsiPair(f,"heelRaise",b.cote),lpf=lsiPair(f,"flexPlantaire",b.cote),lfd=lsiPair(f,"flexDorsale",b.cote),linv=lsiPair(f,"inversion",b.cote),lev=lsiPair(f,"eversion",b.cote),labd=lsiPair(f,"abdHanche",b.cote);
      const hopL={};HOPS.forEach(([k,,,inv])=>{const v=lsiPair(fn,k,b.cote);hopL["lsiHop_"+k]=v===null?null:(inv?10000/v:v)});
      const sc=b.cote&&b.cote!=="B"?[sebtComposite(fn,b.cote),sebtComposite(fn,otherSide(b.cote))]:[null,null];
      const ls=sc[0]&&sc[1]&&sc[1].v?sc[0].v/sc[1].v*100:null;

        fonction:clamp(mean([...Object.values(hopL),ls,lyo,lyf].map(cap))),

        detail:{mob,lsiHeelRaise:lhr,lsiFP:lpf,lsiFD:lfd,lsiInv:linv,lsiEv:lev,lsiAbd:labd,lsiSebt:ls,lsiEqYO:lyo,lsiEqYF:lyf,...hopL,lsiHop:hopL.lsiHop_singleHop,lsiUni:lyo}};
    },

// Alerte « bilan de fin de phase » synchronisée avec la phase (source = phase:<id>)
function syncPhaseAlert(d,ph,removed){
  const src="phase:"+ph.id;const ex=d.alertes.find(a=>a.source===src);const open=a=>a&&(a.statut==="À faire"||a.statut==="En cours");
  if(removed){return ex?{...d,alertes:d.alertes.filter(a=>a!==ex||!open(a))}:d}
  const active=(ph.statut==="À venir"||ph.statut==="En cours")&&ph.fin;
  if(active){const msg=`Bilan de fin de phase — ${ph.phase}${ph.cycle?" "+ph.cycle:""}`;
    if(ex)return {...d,alertes:d.alertes.map(a=>a===ex?{...a,echeance:ph.fin,message:msg,statut:open(a)?a.statut:"À faire"}:a)};
    const n=(d.counters.A||0)+1;return {...d,counters:{...d.counters,A:n},alertes:[...d.alertes,{id:"A-"+pad(n),patientId:ph.patientId,echeance:ph.fin,type:"Bilan à réaliser",priorite:"Haute",message:msg,statut:"À faire",source:src,auto:true}]}}
  if(open(ex))return {...d,alertes:d.alertes.map(a=>a===ex?{...a,statut:ph.statut==="Terminée"?"Terminée":"Ignorée"}:a)};
  return d;
}
function migrate(d){
  if(!d||!Array.isArray(d.patients))return null;
  const base=seed();
  ["bilans","deficits","phases","seances","rdv","alertes","programmes","documents","audit"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  d.settings={...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),...(d.settings||{})};
  Object.keys(DEFAULT_SETTINGS).forEach(k=>{if(typeof DEFAULT_SETTINGS[k]==="object")d.settings[k]={...DEFAULT_SETTINGS[k],...(d.settings[k]||{})}});
  d.counters={...base.counters,...(d.counters||{})};
  if(!Array.isArray(d.dismissed))d.dismissed=[];
  if(!Array.isArray(d.seanceTemplates))d.seanceTemplates=[];
  if(!d.meta?.phaseAlerts){d.phases.forEach(ph=>{d=syncPhaseAlert(d,ph)});d.meta={...(d.meta||{}),phaseAlerts:true}}
  if(!Array.isArray(d.exercices)||!Array.isArray(d.chaines)){const L=seedLibrary();d.exercices=L.exercices;d.chaines=L.chaines;d.counters={...(d.counters||{}),EX:L.exN,CH:L.chN}}
  d.bilans=d.bilans.map(b=>typeof b.synthese==="string"?{...b,synthese:{synthese:b.synthese}}:b);
  d.meta={...(d.meta||{}),appVersion:APP_VERSION};
  return d;
}

const byPatient=(arr,pid)=>arr.filter(x=>x.patientId===pid);
const sortDate=(arr,k="date",dir=1)=>[...arr].sort((a,b)=>dir*((a[k]||"").localeCompare(b[k]||"")));
function lastSeance(db,pid){const s=sortDate(byPatient(db.seances,pid).filter(x=>(!x.type||x.type==="Kiné")&&x.statut!=="Planifiée"),"date",-1);return s[0]||null}
function currentPhase(db,pid){
  const ph=byPatient(db.phases,pid);
  return ph.find(p=>p.statut==="En cours")||sortDate(ph.filter(p=>p.statut==="À venir"),"debut")[0]||null;
}
function nextDeadline(db,pid){
  const t=TODAY();
  const rdv=sortDate(byPatient(db.rdv,pid).filter(r=>r.statut==="Prévu"&&parseD(r.date)>=t),"date")[0];
  const al=sortDate(byPatient(db.alertes,pid).filter(a=>a.statut==="À faire"||a.statut==="En cours"),"echeance")[0];
  const cand=[];
  if(rdv)cand.push({kind:"rdv",date:rdv.date,label:`${rdv.type} — ${rdv.pro||""}`.replace(/ — $/,""),detail:[rdv.heure,rdv.lieu,rdv.notes].filter(Boolean).join(" · "),item:rdv});
  if(al)cand.push({kind:"alerte",date:al.echeance,label:al.message||al.type,detail:`${al.type} · priorité ${al.priorite}`,item:al});
  if(!cand.length)return {case:"aucune",main:null,other:null};
  cand.sort((a,b)=>a.date.localeCompare(b.date));
  const main=cand[0];main.days=daysBetween(t,parseD(main.date));
  const other=cand[1]||null;if(other)other.days=daysBetween(t,parseD(other.date));
  return {case:rdv&&al?"les deux":rdv?"rdv seul":"alerte seule",main,other};
}
function kiviatSet(db,pid){
  const bl=sortDate(byPatient(db.bilans,pid),"date");
  const init=bl.find(b=>b.type==="Initial")||null;
  const inter=[...bl].reverse().find(b=>b.type==="Intermédiaire")||null;
  const fin=[...bl].reverse().find(b=>b.type==="Final")||null;
  return {init,inter,fin,all:bl};
}
function patientDeadlineShort(db,pid){const n=nextDeadline(db,pid);return n.main}

function Radar({series,size=300}){
  const W=size+120,cx=W/2,cy=size/2+4,R=size/2-40,n=AXES.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  const ring=lv=>AXES.map((_,i)=>pt(i,lv).join(",")).join(" ");
  return html`<svg viewBox=${`0 0 ${W} ${size+8}`} width="100%" style=${{maxWidth:W+40,display:"block",margin:"0 auto"}}>
    ${[20,40,60,80,100].map(l=>html`<polygon key=${l} points=${ring(l)} fill=${l===100?"#FAFAF7":"none"} stroke="#E3E1DA" strokeWidth="1"/>`)}
    ${AXES.map((_,i)=>{const [x,y]=pt(i,100);return html`<line key=${i} x1=${cx} y1=${cy} x2=${x} y2=${y} stroke="#E3E1DA"/>`})}
    ${[50,100].map(l=>{const [x,y]=pt(0,l);return html`<text key=${l} x=${x+4} y=${y+3} fontSize="9" fill="#A9A69B">${l}</text>`})}
    ${series.map(s=>{
      const av=AXES.map(([k],i)=>({i,v:s.values[k]})).filter(o=>o.v!==null&&o.v!==undefined);
      if(!av.length)return null;
      const pts=av.map(o=>pt(o.i,o.v).join(",")).join(" ");
      return html`<g key=${s.key}>
        ${av.length>=3?html`<polygon points=${pts} fill=${s.color} fillOpacity=${s.key==="inter"?0.22:0.08} stroke=${s.color} strokeWidth="2" strokeLinejoin="round" strokeDasharray=${av.length<n?"5 3":""}/>`:html`<polyline points=${pts} fill="none" stroke=${s.color} strokeWidth="2"/>`}
        ${av.map(o=>{const [x,y]=pt(o.i,o.v);return html`<circle key=${o.i} cx=${x} cy=${y} r="3.2" fill="#fff" stroke=${s.color} strokeWidth="2"/>`})}
      </g>`;
    })}
    ${AXES.map(([k,l],i)=>{const [x,y]=pt(i,122);const anyMissing=series.some(s=>s.values[k]===null);return html`<text key=${k} x=${x} y=${y} textAnchor=${Math.abs(x-cx)<8?"middle":x>cx?"start":"end"} dominantBaseline="middle" fontSize="11.5" fontWeight="700" fill="#3A3A3E">${l}${anyMissing?"*":""}</text>`})}
  </svg>`;
}
function KiviatCard({db,pid,openMethod}){
  const S=db.settings;const ks=kiviatSet(db,pid);
  const [mode,setMode]=useState("auto");const [a,setA]=useState("");const [b,setB]=useState("");
  const all=ks.all;
  let series=[];
  if(mode==="auto"){
    [["init","Initial",ks.init,"var(--c-init)","#9A988F"],["inter","Dernier intermédiaire",ks.inter,"var(--c-inter)","#E0AE14"],["fin","Final",ks.fin,"var(--c-final)","#18181A"]].forEach(([k,l,bl,_,c])=>{if(bl)series.push({key:k,label:`${l} · ${fmtDs(bl.date)}`,color:c,values:computeBilan(bl,S),bilan:bl})});
  }else{
    const A=all.find(x=>x.id===a),B=all.find(x=>x.id===b);
    if(A)series.push({key:"init",label:`${A.type} · ${fmtDs(A.date)}`,color:"#9A988F",values:computeBilan(A,S),bilan:A});
    if(B)series.push({key:"inter",label:`${B.type} · ${fmtDs(B.date)}`,color:"#E0AE14",values:computeBilan(B,S),bilan:B});

function Spark({points,color="#18181A",h=46,max=100,unit=""}){
  if(points.length<1)return html`<div className="empty">—</div>`;
  const w=220,pad=16;
  const xs=points.map((_,i)=>points.length===1?w/2:pad+i*(w-2*pad)/(points.length-1));
  const ys=points.map(p=>h-pad-(p.v/max)*(h-2*pad));
  return html`<svg viewBox=${`0 0 ${w} ${h+14}`} width="100%" style=${{display:"block"}}>
    <line x1=${pad} x2=${w-pad} y1=${h-pad} y2=${h-pad} stroke="#EEEDE7"/>
    <polyline points=${xs.map((x,i)=>x+","+ys[i]).join(" ")} fill="none" stroke=${color} strokeWidth="2" strokeLinejoin="round"/>
    ${xs.map((x,i)=>html`<g key=${i}><circle cx=${x} cy=${ys[i]} r="3" fill="#fff" stroke=${color} strokeWidth="2"/><text x=${x} y=${ys[i]-7} textAnchor="middle" fontSize="9.5" fontWeight="700" fill="#3A3A3E">${r0(points[i].v)}${unit}</text><text x=${x} y=${h+11} textAnchor="middle" fontSize="8.5" fill="#A9A69B">${fmtDs(points[i].d).slice(0,5)}</text></g>`)}
  </svg>`;
}

// Normes T-Test (Semenick 1990, athlètes adultes de sports collectifs) — indicatif.
function tRating(t,sexe){if(t===null||t===undefined)return null;const lim=sexe==="F"?[10.5,11.5,12.5]:sexe==="M"?[9.5,10.5,11.5]:null;if(!lim)return null;return t<lim[0]?"Excellent":t<=lim[1]?"Bon":t<=lim[2]?"Moyen":"Faible"}
const BC_TYPES=["Douleur","Raideur","Gêne","Gonflement","Instabilité","Paresthésie","Autre"];

// Données d'un bilan en ignorant les sections désactivées (les mesures brutes restent stockées).
function effBilan(b){
  const en=b.enabled;if(!en)return b;
  const on=k=>en[k]!==false;
  const e={...b};
  if(!on("douleur"))e.douleur={};
  const mo={...(b.mobilite||{})};
  if(!on("mobilite"))Object.keys(mo).filter(k=>!k.startsWith("ktw")).forEach(k=>delete mo[k]);
  if(!on("wblt")||(b.region!=="cheville"&&!on("mobilite")))Object.keys(mo).filter(k=>k.startsWith("ktw")).forEach(k=>delete mo[k]);
  e.mobilite=mo;
  const fo={...(b.force||{})};
  if(!on("dynamo"))Object.keys(fo).filter(k=>!k.startsWith("heelRaise")).forEach(k=>delete fo[k]);
  if(!on("heelRaise"))Object.keys(fo).filter(k=>k.startsWith("heelRaise")).forEach(k=>delete fo[k]);
  e.force=fo;
  if(!on("perimetrie"))e.perimetrie={};
  if(b.region==="muscle"&&!on("souplesse"))e.mobilite={};
  if(!on("palpM"))e.palp={};
  if(!on("terrain"))e.terrain={};
  if(!on("psfs"))e.psfs={};
  if(!on("bodychart"))e.bodychart=[];
  const fn={...(b.fonction||{})};
  if(!on("sebt"))Object.keys(fn).filter(k=>k.startsWith("sebt")).forEach(k=>delete fn[k]);
  if(!on("hop"))Object.keys(fn).filter(k=>HOPS.some(h=>k.startsWith(h[0]+"_"))).forEach(k=>delete fn[k]);
  if(!on("equilibre"))Object.keys(fn).filter(k=>k.startsWith("eq")).forEach(k=>delete fn[k]);
  if(!on("endurance"))ENDUR_KEYS.forEach(k=>{delete fn[k+"_D"];delete fn[k+"_G"]});
  e.fonction=fn;
  const q={...(b.questionnaires||{})};
  if(!on("questionnaires")){const s=q.sane;Object.keys(q).forEach(k=>delete q[k]);if(s!==undefined)q.sane=s}
  if(!on("sane"))delete q.sane;
  e.questionnaires=q;
  return e;
}
function sebtComposite(fn,side){
  if(num(fn[`sebt_${side}`])!==null)return {v:num(fn[`sebt_${side}`]),norm:true};
  const a=num(fn[`sebtA_${side}`]),pm=num(fn[`sebtPM_${side}`]),pl=num(fn[`sebtPL_${side}`]),L=num(fn[`sebtL_${side}`]);
  if(a===null||pm===null||pl===null)return null;
  return L?{v:(a+pm+pl)/(3*L)*100,norm:true}:{v:a+pm+pl,norm:false};
}
function psfsMean(ps){return mean([num(ps?.s1),num(ps?.s2),num(ps?.s3)])}
// Côtés : colonnes « lésé / sain » mappées sur D/G selon le côté du bilan.
function sideCols(cote){
  if(cote==="G")return [{k:"G",l:"Lésé (G)"},{k:"D",l:"Sain (D)"}];
  if(cote==="B")return [{k:"D",l:"Droit"},{k:"G",l:"Gauche"}];
  return [{k:"D",l:"Lésé (D)"},{k:"G",l:"Sain (G)"}];
}
const fmtN=(v,d=0)=>v===null||v===undefined||isNaN(v)?"—":(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("fr-FR");
const lsiCls=v=>v===null?"sub":v>=90?"ok-t":v>=80?"warn-t":"bad-t";
const getP=(o,p)=>p.split(".").reduce((x,k)=>x==null?undefined:x[k],o);
const setP=(o,p,v)=>{const ks=p.split(".");const c=Array.isArray(o)?[...o]:{...o};let cur=c;for(let i=0;i<ks.length-1;i++){const k=ks[i];cur[k]=Array.isArray(cur[k])?[...cur[k]]:{...(cur[k]||{})};cur=cur[k]}cur[ks[ks.length-1]]=v;return c};

function blankBilan(db,pid,type,region){

   get:(c,b)=>{const v=num(b.questionnaires?.cait);return v===null?null:{v,txt:`CAIT ${fmtN(v)}/30`}},bad:v=>v<=27.5,cible:"> 27,5/30",ecart:v=>`${fmtN(27.5-v,1)} pts`,prio:v=>v<=18?"Haute":"Normale"}
);
const rulesFor=r=>DEF_RULES.filter(x=>(x.regions||["genou"]).includes(r||"genou"));
function deficitSuggestions(db,pid){
  const S=db.settings;
  const last=sortDate(byPatient(db.bilans,pid).filter(b=>REGIONS[b.region]),"date",-1)[0];
  if(!last)return {bilan:null,items:[]};
  const eb=effBilan(last),c=computeBilan(last,S),side=sideLabel(last.cote).toLowerCase();const RL=last.region==="muscle"?({mollet:"Jambe",adducteurs:"Hanche"}[muscleOf(last)]||"Cuisse"):(REGION_DEF_LABEL[last.region]||"Genou");
  const defs=byPatient(db.deficits,pid);const dismissed=new Set(db.dismissed||[]);
  const items=[];
  rulesFor(last.region).forEach(r=>{
    const m=r.get(c,eb);if(!m)return;
    const ex=defs.find(d=>d.sourceKey===r.key&&d.statut!=="Résolu");
    const tag=`${last.id}:${r.key}`;if(dismissed.has(tag))return;
    const isBad=r.bad(m.v);
    if(isBad&&!ex)items.push({kind:"new",rule:r,m,tag,draft:{dateId:last.date,region:RL,domaine:r.domaine,description:r.desc(side),valeur:m.txt,cible:r.cible,ecart:r.ecart(m.v),priorite:r.prio(m.v),objectif:"",statut:"Actif",notes:`Suggéré depuis ${last.id} · règle : ${r.regle}`,sourceKey:r.key,sourceBilan:last.id}});
    else if(isBad&&ex&&ex.valeur!==m.txt&&ex.sourceBilan!==last.id)items.push({kind:"maj",rule:r,m,tag,def:ex});
    else if(!isBad&&ex)items.push({kind:"resolu",rule:r,m,tag,def:ex});
  });
  return {bilan:last,items};
}

const normName=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function seedLibrary(){
  const ex=[],byN={},ch=[];let n=0;
  LIB_SEED.forEach(([art,label,items],ci)=>{
    const ids=items.map(nm=>{const k=normName(nm);if(!byN[k]){n++;byN[k]="EX-"+pad(n);ex.push({id:byN[k],nom:nm,articulation:art,notes:"",source:"Training Thérapie"})}return byN[k]});
    ch.push({id:"CH-"+pad(ci+1,3),articulation:art,label,items:ids});
  });
  return {exercices:ex,chaines:ch,exN:n,chN:LIB_SEED.length};
}
const findEx=(db,id)=>(db.exercices||[]).find(e=>e.id===id);
const findExByName=(db,nm)=>{const k=normName(nm);return k?(db.exercices||[]).find(e=>normName(e.nom)===k):null};
// Toutes les positions d'un exercice dans les chaînes (prev / next)
function exPositions(db,exId){
  return (db.chaines||[]).filter(c=>c.items.includes(exId)).map(c=>{const i=c.items.indexOf(exId);return {chaine:c,niveau:i+1,prev:i>0?c.items[i-1]:null,next:i<c.items.length-1?c.items[i+1]:null}});
}

const SE_TYPES=["Kiné","Autonomie","Entraînement club","Match"];
const REPONSES=["Très bonne","Bonne","Neutre","Mauvaise","Très mauvaise"];
const repCls=r=>({"Très bonne":"p-actif","Bonne":"p-actif","Neutre":"p-basse","Mauvaise":"p-haute","Très mauvaise":"p-prio"}[r]||"p-basse");
const sRPE=s=>{const r=num(s.rpe),d=num(s.duree);return r!==null&&d!==null?r*d:null};
const weekStart=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x};
function weeklyLoad(seances,nWeeks=8){
  const t=weekStart(TODAY());const weeks=[];
  for(let i=nWeeks-1;i>=0;i--){const s=new Date(t);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);
    const ss=seances.filter(x=>{const d=parseD(x.date);return d&&d>=s&&d<e&&x.statut!=="Planifiée"});
    const byType={};SE_TYPES.forEach(ty=>byType[ty]=0);let tot=0,miss=0;
    ss.forEach(x=>{const v=sRPE(x);if(v===null){miss++;return}tot+=v;byType[x.type||"Kiné"]+=v});
    weeks.push({start:s,tot,byType,n:ss.length,miss});}
  return weeks;
}
const TYPE_COL={"Kiné":"#18181A","Autonomie":"#9A988F","Entraînement club":"#F2C230","Match":"#B23A2E"};
function LoadChart({weeks,h=170,W=1000}){
  const max=Math.max(1,...weeks.map(w=>w.tot));const pad=34,bw=(W-pad*2)/weeks.length*0.62;
  return html`<svg viewBox=${`0 0 ${W} ${h+34}`} width="100%">
    ${[0,0.5,1].map(f=>html`<g key=${f}><line x1=${pad} x2=${W-8} y1=${h-f*(h-14)} y2=${h-f*(h-14)} stroke="#EEEDE7"/><text x=${pad-4} y=${h-f*(h-14)+3} textAnchor="end" fontSize="9" fill="#A9A69B">${r0(max*f)}</text></g>`)}
    ${weeks.map((w,i)=>{const x=pad+i*(W-pad*2)/weeks.length+((W-pad*2)/weeks.length-bw)/2;let y=h;
      return html`<g key=${i}>${SE_TYPES.map(ty=>{const v=w.byType[ty];if(!v)return null;const hh=v/max*(h-14);y-=hh;return html`<rect key=${ty} x=${x} y=${y} width=${bw} height=${hh} fill=${TYPE_COL[ty]} rx="2"><title>${ty} : ${r0(v)} UA</title></rect>`})}
        ${w.tot>0&&html`<text x=${x+bw/2} y=${y-4} textAnchor="middle" fontSize="9.5" fontWeight="700" fill="#3A3A3E">${r0(w.tot)}</text>`}
        <text x=${x+bw/2} y=${h+13} textAnchor="middle" fontSize="9" fill="#7A786F">${w.start.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</text>
        ${w.miss>0&&html`<text x=${x+bw/2} y=${h+25} textAnchor="middle" fontSize="8.5" fill="#B26A00">${w.miss} sans RPE/durée</text>`}</g>`})}
  </svg>`;
}
function ChargeCard({db,pid}){
  const weeks=weeklyLoad(byPatient(db.seances,pid));const cur=weeks[weeks.length-1],prev=weeks[weeks.length-2];
  const prev4=mean(weeks.slice(-5,-1).map(w=>w.tot));
  const delta=prev&&prev.tot?((cur.tot-prev.tot)/prev.tot*100):null;
  return html`<div className="card" style=${{marginBottom:16}}>
    <div className="card-h"><span className="card-t">Charge interne hebdomadaire (sRPE)</span><span className="src">RPE × durée (min) = UA</span></div>
    <div className="grid g4" style=${{gap:10,marginBottom:6}}>
      <div className="stat"><b>${r0(cur.tot)}</b><span>UA cette semaine</span></div>
      <div className="stat"><b>${prev?r0(prev.tot):"—"}</b><span>Semaine précédente</span></div>
      <div className="stat"><b className=${delta===null?"":Math.abs(delta)>30?"warn-t":""}>${delta===null?"—":(delta>0?"+":"")+r0(delta)+" %"}</b><span>Variation hebdo</span></div>
      <div className="stat"><b>${prev4?r0(prev4):"—"}</b><span>Moyenne 4 sem. préc.</span></div>
    </div>
    <${LoadChart} weeks=${weeks}/>

    <div className="sub" style=${{fontSize:11.5,marginTop:6}}>N'inclut que les séances saisies ici : ajoutez les entraînements club et matchs (type, durée, RPE) pour une charge complète. Indicateur de suivi, à interpréter cliniquement.</div>
  </div>`;
}

function programmeText(p,pt){
  const L=[`${p.nom}${pt?" — "+pt.prenom:""}`,`${fmtD(p.debut)} → ${fmtD(p.fin)}${p.objectif?" · "+p.objectif:""}`,""];
  (p.exercices||[]).forEach((e,i)=>{L.push(`${i+1}. ${e.nom}`);const parts=[e.series&&e.reps?`${e.series} × ${e.reps}`:"",e.charge,e.tempo?"tempo "+e.tempo:"",e.frequence].filter(Boolean);if(parts.length)L.push("   "+parts.join(" · "));if(e.notes)L.push("   "+e.notes)});
  if(p.consignes){L.push("","Consignes : "+p.consignes)}
  return L.join("\n");
}

  if(typeof v!=="number"||typeof ref!=="number")return null;
  const d=v-ref;if(Math.abs(d)<Math.pow(10,-dec)/2)return html`<span className="sub" style=${{fontSize:11}}>=</span>`;

function BodyChartView({db,pid,openBilan}){
  const bl=sortDate(byPatient(db.bilans,pid),"date",-1);
  const withBc=bl.filter(b=>(effBilan(b).bodychart||[]).length);
  const [sel,setSel]=useState(withBc[0]?.id||bl[0]?.id||"");
  const b=bl.find(x=>x.id===sel);const list=b?effBilan(b).bodychart||[]:[];
  if(!bl.length)return html`<div className="ph-hero"><h3>Aucun bilan</h3><div className="sub">Les symptômes se saisissent dans la section BodyChart de chaque bilan.</div></div>`;
  // historique : une ligne par zone/côté/type, une colonne par bilan (ordre chronologique)
  const chrono=[...withBc].reverse();const keyOf=m=>`${m.zone}|${m.cote}|${m.type}`;
  const rows={};chrono.forEach(x=>(effBilan(x).bodychart||[]).forEach(m=>{const k=keyOf(m);if(!rows[k])rows[k]={m,vals:{}};rows[k].vals[x.id]=Math.max(rows[k].vals[x.id]??0,num(m.intensite)??0)}));

    <div className="tbar"><span className="sub">Bilan affiché</span><select className="inp" style=${{width:280}} value=${sel} onChange=${e=>setSel(e.target.value)}>${bl.map(x=>html`<option key=${x.id} value=${x.id}>${x.type} · ${fmtDs(x.date)} (${(effBilan(x).bodychart||[]).length} symptôme${(effBilan(x).bodychart||[]).length>1?"s":""})</option>`)}</select>
      <div className="spacer"></div>${b&&html`<button className="btn" onClick=${()=>openBilan(b.id)}>Modifier dans le bilan</button>`}</div>
    <div className="grid g2" style=${{marginBottom:16}}>
      <div className="card"><div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <${Silhouette} vue="face" label="Face" big=${true} marks=${list.filter(m=>m.vue==="face").map(m=>({...m,intensite:num(m.intensite)??0}))}/>
        <${Silhouette} vue="dos" label="Dos" big=${true} marks=${list.filter(m=>m.vue==="dos").map(m=>({...m,intensite:num(m.intensite)??0}))}/></div>
        <div className="legend" style=${{justifyContent:"center",marginTop:8}}><span><i style=${{background:"#F2C230",height:8}}></i>1–3</span><span><i style=${{background:"#E08A1E",height:8}}></i>4–6</span><span><i style=${{background:"#B23A2E",height:8}}></i>7–10</span></div></div>
      <div className="card"><div className="card-h"><span className="card-t">Symptômes · ${b?fmtDs(b.date):""}</span></div>
        ${list.length===0?html`<div className="empty">Aucun symptôme cartographié dans ce bilan.</div>`:list.map((m,i)=>html`<div key=${i} className="def-row"><span style=${{width:10,height:10,borderRadius:"50%",background:intensColor(num(m.intensite)??0),flex:"none"}}></span><div className="d"><b>${BC_ZONES[m.zone]?.label||m.zone} ${m.cote!=="B"?sideLabel(m.cote).toLowerCase():""} · ${m.type}</b><span>${m.commentaire||""} (${m.vue})</span></div><span className="mono">${m.intensite}/10</span></div>`)}</div>
    </div>
    ${chrono.length>1&&html`<div className="card"><div className="card-h"><span className="card-t">Évolution des symptômes</span><span className="src">Intensité /10 par bilan · — = absent</span></div>
      <div className="h-scroll"><table style=${{fontSize:13}}><thead><tr><th>Zone · côté · type</th>${chrono.map(x=>html`<th key=${x.id} style=${{textAlign:"center"}}>${x.type}<div style=${{fontWeight:600,textTransform:"none",letterSpacing:0}}>${fmtDs(x.date)}</div></th>`)}</tr></thead>
      <tbody>${Object.values(rows).map(({m,vals})=>html`<tr key=${keyOf(m)}><td><b>${BC_ZONES[m.zone]?.label||m.zone}</b> ${m.cote!=="B"?sideLabel(m.cote).toLowerCase():""} · ${m.type}</td>
        ${chrono.map(x=>{const v=vals[x.id];return html`<td key=${x.id} style=${{textAlign:"center"}}>${v===undefined?html`<span className="sub">—</span>`:html`<span className="mono" style=${{display:"inline-block",minWidth:28,padding:"2px 6px",borderRadius:6,fontWeight:800,background:intensColor(v)+"33",color:"#18181A"}}>${v}</span>`}</td>`})}</tr>`)}</tbody></table></div></div>`}
  </div>`;
}

      if(n<16)return {score:null,msg:`${n}/18 items : au moins 16 requis`};return {score:sum/max*100,msg:`${n}/18 items · ${sum}/${max} pts`+(n<18?" (score sur les items complétés)":"")}}},
  koos:{nom:"KOOS",ref:"Roos 1998 · 42 items · 5 sous-échelles /100",field:"koos",
    groups:[["P","Douleur",9,5],["S","Symptômes",7,4],["A","Vie quotidienne (AVQ)",17,9],["SP","Sport et loisirs",5,3],["Q","Qualité de vie",4,2]],

const VAULT_KEY="bpps_vault_v1",VAULT_ITER=600000;

  return {format:"bpps-vault",v:1,kdf:"PBKDF2-SHA256",iter:k.iter,salt:b64e(k.salt),iv:b64e(iv),ct:b64e(ct),savedAt:new Date().toISOString()}}
async function vOpen(env,pw){if(!env||env.format!=="bpps-vault")throw {code:"format"};const salt=b64d(env.salt);const key=await vDerive(pw,salt,env.iter);
  let pt;try{pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(env.iv)},key,b64d(env.ct))}catch(e){throw {code:"password"}}
  return {obj:JSON.parse(_dec.decode(pt)),k:{key,salt,iter:env.iter}}}
async function vNewKey(pw){const salt=crypto.getRandomValues(new Uint8Array(16));return {key:await vDerive(pw,salt,VAULT_ITER),salt,iter:VAULT_ITER}}
const vStore={get(){try{const s=localStorage.getItem(VAULT_KEY);return s?JSON.parse(s):null}catch(e){return null}},set(env){try{localStorage.setItem(VAULT_KEY,JSON.stringify(env));return true}catch(e){return false}},
  clear(){try{localStorage.removeItem(VAULT_KEY);localStorage.removeItem("bpps_last_backup")}catch(e){}},
  pref(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},setPref(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Marque chaque enregistrement créé/modifié (_c création, _m modification) et note les suppressions (meta._del).
function stampDb(prev,d){
  if(!prev||!d)return d;const now=nowISO();const dev=deviceId();const del={...(d.meta?._del||{})};let ch=false;
  SYNC_COLLS.forEach(c=>{const a=d[c],pa=prev[c];if(!Array.isArray(a))return;const pm=new Map((pa||[]).map(x=>[x&&x.id,x]));const ids=new Set();
    a.forEach(x=>{if(!x||!x.id)return;ids.add(x.id);const o=pm.get(x.id);if(o===x)return;
      if(!o){if(!x._c)x._c=dev+":"+now;if(!x._m)x._m=now;return}
      if(!x._c&&o._c)x._c=o._c;if(x._m===o._m||!x._m)x._m=now});
    (pa||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id)){del[c+":"+x.id]=now;ch=true}})});
  if(ch)d.meta={...(d.meta||{}),_del:del};return d;
}
function deepRename(o,ren){if(typeof o==="string")return ren[o]||o;if(Array.isArray(o))return o.map(x=>deepRename(x,ren));if(o&&typeof o==="object"){const r={};for(const k in o)r[k]=deepRename(o[k],ren);return r}return o}
function mergeDb(L,I){
  let inc=JSON.parse(JSON.stringify(I));const rep={ajoutes:0,misAJour:0,supprimes:0,renommes:0};
  const allIds=new Set();SYNC_COLLS.forEach(c=>[...(L[c]||[]),...(inc[c]||[])].forEach(x=>x&&x.id&&allIds.add(x.id)));
  const ren={};
  SYNC_COLLS.forEach(c=>{const byC=new Map((L[c]||[]).filter(x=>x._c).map(x=>[x._c,x.id]));(inc[c]||[]).forEach(x=>{const lid=x._c&&byC.get(x._c);if(lid&&lid!==x.id)ren[x.id]=lid})});
  SYNC_COLLS.forEach(c=>{const lm=new Map((L[c]||[]).map(x=>[x.id,x]));(inc[c]||[]).forEach(x=>{if(ren[x.id])return;const l=lm.get(x.id);
    if(l&&l._c&&x._c&&l._c!==x._c){const m=/^(.*?)(\d+)$/.exec(x.id);let n=m?+m[2]:0,nid;do{n++;nid=m?m[1]+String(n).padStart(m[2].length,"0"):x.id+"-"+n}while(allIds.has(nid));allIds.add(nid);ren[x.id]=nid}})});
  if(Object.keys(ren).length){const f=inc._files;delete inc._files;inc=deepRename(inc,ren);inc._files=f;rep.renommes=Object.values(ren).filter(v=>!(L.patients||[]).concat(...SYNC_COLLS.map(c=>L[c]||[])).some(x=>x.id===v)).length}
  const del={...(inc.meta?._del||{})};Object.entries(L.meta?._del||{}).forEach(([k,v])=>{if(!del[k]||del[k]<v)del[k]=v});
  const out={...L};
  SYNC_COLLS.forEach(c=>{const m=new Map((L[c]||[]).map(x=>[x.id,x]));
    (inc[c]||[]).forEach(x=>{if(!x||!x.id)return;const l=m.get(x.id);if(!l){m.set(x.id,x);rep.ajoutes++}else if((x._m||"")>(l._m||"")){m.set(x.id,x);rep.misAJour++}});
    const arr=[];m.forEach(x=>{const t=del[c+":"+x.id];if(t&&t>=(x._m||"")){if((L[c]||[]).some(y=>y.id===x.id))rep.supprimes++;return}arr.push(x)});out[c]=arr});
  const cnt={...(inc.counters||{})};Object.entries(L.counters||{}).forEach(([k,v])=>{cnt[k]=Math.max(v||0,cnt[k]||0)});
  SYNC_COLLS.forEach(c=>(out[c]||[]).forEach(x=>{const m=/^([A-Z]+)-(\d+)$/.exec(x.id||"");if(m)cnt[m[1]]=Math.max(cnt[m[1]]||0,+m[2])}));out.counters=cnt;
  const seen=new Set();out.audit=[...(L.audit||[]),...(inc.audit||[])].filter(a=>{const k=(a.at||"")+"|"+(a.msg||"");if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
  out.dismissed=[...new Set([...(L.dismissed||[]),...(inc.dismissed||[])])];
  const st={...(inc.settings||{}),...(L.settings||{})};const bt=new Map([...(inc.settings?.bilanTemplates||[]),...(L.settings?.bilanTemplates||[])].map(t=>[t.id,t]));st.bilanTemplates=[...bt.values()];
  const ql={...(inc.settings?.qLabels||{})};Object.entries(L.settings?.qLabels||{}).forEach(([q,v])=>{ql[q]={...(ql[q]||{}),...v}});st.qLabels=ql;out.settings=st;
  out.meta={...(L.meta||{}),_del:del,lastMerge:nowISO()};
  return {db:out,report:rep,files:inc._files||{}};
}
const touchDevice=()=>{try{return window.matchMedia("(pointer:coarse)").matches}catch(e){return false}};
function anchorDownload(name,data,type="application/octet-stream"){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},500)}
function emptyDb(){const d=seed();return {...d,patients:[],bilans:[],deficits:[],phases:[],seances:[],rdv:[],alertes:[],programmes:[],documents:[],audit:[],dismissed:[],
  counters:{...d.counters,P:0,B:0,D:0,PH:0,S:0,R:0,A:0,PR:0,DOC:0},meta:{...d.meta,demo:false,secure:true,createdAt:nowISO()}}}
const readFileText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)});
const pwIssue=p=>p.length<10?"10 caractères minimum (une phrase de passe est idéale).":null;

async function writeFiles(files,k){if(!files)return;for(const [id,f] of Object.entries(files)){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k.key,b64d(f.b64)));await fileStore.put(id,{name:f.name,type:f.type,size:f.size,iv,ct})}}

  <div style=${{width:"min(440px,100%)",background:"#fff",borderRadius:16,padding:"28px 26px",boxShadow:"0 30px 80px rgba(0,0,0,.4)"}}>
    <div className="brand-mark" style=${{marginBottom:18}}><div className="logo">BP</div><div className="brand-name" style=${{color:"var(--ink)"}}>BP PHYSIOSPORT<span style=${{color:"var(--muted)"}}>SUITE · VERSION SÉCURISÉE</span></div></div>
    ${children}
    <div className="sub" style=${{fontSize:11.5,marginTop:18,borderTop:"1px solid var(--line)",paddingTop:12}}>Données chiffrées (AES-256) sur cet ordinateur uniquement. Aucune connexion internet. Le mot de passe n'est enregistré nulle part.</div>
  </div></div>`}

      const olds=[];for await (const [n] of h.entries())if(/^bpps-auto-\d{4}-\d{2}-\d{2}\.bpps$/.test(n))olds.push(n);olds.sort().reverse().slice(AUTO_KEEP).forEach(n=>h.removeEntry(n).catch(()=>{}));

  const unlock=async e=>{e.preventDefault();if(fails>=5&&Date.now()-(window.__bppsLast||0)<30000)return setErr("Trop d'essais : patientez 30 secondes.");
    setBusy(true);try{const {obj,k}=await vOpen(vStore.get(),pw);enter(migrate(obj),k)}catch(x){window.__bppsLast=Date.now();setFails(f=>f+1);setErr(x&&x.code==="password"?"Mot de passe incorrect.":"Coffre illisible.")}setBusy(false)};
  const pickRestore=async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;try{const env=JSON.parse(await readFileText(f));if(env.format!=="bpps-vault")throw 0;setRestore({env,name:f.name,pw:""});setErr("")}catch(x){setErr("Fichier non reconnu : choisissez une sauvegarde .bpps.")}};

  const vault={

    async encBytes(u8){const k=kRef.current;const iv=crypto.getRandomValues(new Uint8Array(12));return {iv,ct:new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k.key,u8))}},

  };

/* ---------- stockage des fichiers joints (IndexedDB) ---------- */
const fileStore={_p:null,
  db(){if(!this._p)this._p=new Promise((res,rej)=>{try{const r=indexedDB.open("bpps_files",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this._p},
  async tx(mode,fn){const d=await this.db();return new Promise((res,rej)=>{const t=d.transaction("files",mode);const st=t.objectStore("files");const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(id,v){return this.tx("readwrite",s=>s.put(v,id))},get(id){return this.tx("readonly",s=>s.get(id))},del(id){return this.tx("readwrite",s=>s.delete(id))},
  async keys(){return this.tx("readonly",s=>s.getAllKeys())},async clear(){return this.tx("readwrite",s=>s.clear())}};
const MAX_FILE=10*1024*1024;
// enregistre un fichier (chiffré si coffre) ; renvoie un identifiant
async function saveAttachment(vault,file){
  const id="F-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const buf=new Uint8Array(await file.arrayBuffer());
  const meta={name:file.name,type:file.type||"application/octet-stream",size:file.size};
  await fileStore.put(id,vault?{...meta,...await vault.encBytes(buf)}:{...meta,blob:new Blob([buf],{type:meta.type})});return {id,...meta};
}
async function loadAttachment(vault,id){const r=await fileStore.get(id);if(!r)return null;
  if(r.blob)return r.blob;if(vault&&r.ct)return new Blob([await vault.decBytes(r)],{type:r.type});return null}

/* ---------- formulaire générique ---------- */
function RecForm({title,init,fields,onSave,onClose,onDelete,extra,validate}){
  const [d,setD]=useState(init);const [err,setErr]=useState("");const [cd,setCd]=useState(false);
  const s=(k,v)=>setD(x=>({...x,[k]:v}));
  return html`<${Modal} title=${title} onClose=${onClose} footer=${html`
      ${d.id&&onDelete&&(!cd?html`<button className="btn danger" style=${{marginRight:"auto"}} onClick=${()=>setCd(true)}>Supprimer</button>`:html`<button className="btn primary" style=${{marginRight:"auto",background:"var(--bad)",borderColor:"var(--bad)"}} onClick=${()=>onDelete(d)}>Confirmer la suppression</button>`)}
      <button className="btn" onClick=${onClose}>Annuler</button><button className="btn primary" onClick=${()=>{const e=validate&&validate(d);if(e)return setErr(e);onSave(d)}}>Enregistrer</button>`}>
    <div className="fgrid">${fields.map(([k,l,t,o,cls])=>html`<${F} key=${k} l=${l} cls=${cls||"field"}>${
      t==="date"?html`<input type="date" className="inp" value=${d[k]||""} onChange=${e=>s(k,e.target.value)}/>`:
      t==="time"?html`<input type="time" className="inp" value=${d[k]||""} onChange=${e=>s(k,e.target.value)}/>`:
      t==="sel"?html`<${Sel} v=${d[k]} on=${v=>s(k,v)} opts=${o}/>`:
      t==="area"?html`<${Txt} v=${d[k]} on=${v=>s(k,v)}/>`:html`<${TIn} v=${d[k]} on=${v=>s(k,v)}/>`}</${F}>`)}</div>
    ${extra&&extra(d,s)}

  </${Modal}>`;
}

  const t=todayISO();const in7=(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)})();
  const active=db.patients.filter(p=>p.statut==="Actif");const pName=id=>fullName(db.patients.find(p=>p.id===id));
  const isOpen=a=>a.statut==="À faire"||a.statut==="En cours";
  const visible=id=>{const p=db.patients.find(x=>x.id===id);return p&&p.statut!=="Archivé"};
  const lateAl=sortDate(db.alertes.filter(a=>isOpen(a)&&a.echeance<t&&visible(a.patientId)),"echeance");
  const lateRdv=sortDate(db.rdv.filter(r=>r.statut==="Prévu"&&r.date<t&&visible(r.patientId)),"date");
  const week=[...db.rdv.filter(r=>r.statut==="Prévu"&&r.date>=t&&r.date<=in7&&visible(r.patientId)).map(r=>({k:"rdv",d:r.date,x:r})),...db.alertes.filter(a=>isOpen(a)&&a.echeance>=t&&a.echeance<=in7&&visible(a.patientId)).map(a=>({k:"al",d:a.echeance,x:a}))].sort((a,b)=>a.d.localeCompare(b.d));
  const noSeance=active.map(p=>{const l=sortDate(byPatient(db.seances,p.id).filter(s=>(!s.type||s.type==="Kiné")&&s.statut!=="Planifiée"),"date",-1)[0];const ref=l?l.date:p.debutPEC;const n=ref?daysBetween(parseD(ref),TODAY()):null;return {p,l,n}}).filter(x=>x.n!==null&&x.n>10).sort((a,b)=>b.n-a.n);
  const noBilan=active.filter(p=>!byPatient(db.bilans,p.id).length);
  const plToday=db.seances.filter(x=>x.statut==="Planifiée"&&x.date===t&&visible(x.patientId));
  const unvalid=active.map(p=>({p,n:deficitSuggestions(db,p.id).items.length})).filter(x=>x.n>0);
  const crit=active.map(p=>{const ph=currentPhase(db,p.id);if(!ph||!(ph.critList||[]).length)return null;const ev=evalCrit(db,p.id,ph);return ev.total&&ev.ok===ev.total?{p,ph,ev}:null}).filter(Boolean);
  const Row=({pid,children,right})=>html`<div className="def-row" style=${{cursor:"pointer"}} onClick=${()=>openPatient(pid)}><div className="d">${children}</div>${right}</div>`;
  const dayLab=d=>{const n=daysBetween(TODAY(),parseD(d));return n===0?"Aujourd'hui":n===1?"Demain":parseD(d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"})};
  const empty=!plToday.length&&!lateAl.length&&!lateRdv.length&&!week.length&&!noSeance.length&&!noBilan.length&&!unvalid.length&&!crit.length;
  return html`<div>
    <div className="dash-head"><div><div className="crumbs">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div><h2>Aujourd'hui</h2>
      <div className="meta"><b>${active.length}</b> patient${active.length>1?"s":""} actif${active.length>1?"s":""} · <b>${week.length}</b> échéance${week.length>1?"s":""} sur 7 jours${lateAl.length+lateRdv.length?html` · <span className="bad-t">${lateAl.length+lateRdv.length} en retard</span>`:""}</div></div></div>
    ${empty&&html`<div className="ph-hero"><h3>Rien d'urgent</h3><div className="sub">Aucune échéance en retard ni sur les 7 prochains jours.</div></div>`}
    <div className="grid g2">
      ${(lateAl.length||lateRdv.length)>0&&html`<div className="card" style=${{borderColor:"#E7C3BD"}}><div className="card-h"><span className="card-t bad-t">En retard</span></div>
        ${lateAl.map(a=>html`<${Row} key=${a.id} pid=${a.patientId} right=${html`<span className="bad-t mono" style=${{fontSize:12}}>+${-daysBetween(TODAY(),parseD(a.echeance))} j</span><button className="btn sm" onClick=${e=>{e.stopPropagation();act.saveRec("alertes",{...a,statut:"Terminée"});toast("Alerte terminée")}}>Terminer</button>`}><b>${a.message}</b><span>${pName(a.patientId)} · ${a.type} · ${fmtDs(a.echeance)}</span></${Row}>`)}
        ${lateRdv.map(r=>html`<${Row} key=${r.id} pid=${r.patientId} right=${html`<button className="btn sm" onClick=${e=>{e.stopPropagation();act.saveRec("rdv",{...r,statut:"Réalisé"});toast("Rendez-vous réalisé")}}>Réalisé</button>`}><b>RDV ${r.type} non mis à jour</b><span>${pName(r.patientId)} · ${fmtDs(r.date)} ${r.pro||""}</span></${Row}>`)}
      </div>`}
      ${plToday.length>0&&html`<div className="card accent-bar"><div className="card-h"><span className="card-t">Séances planifiées aujourd'hui</span></div>
        ${plToday.map(x=>html`<${Row} key=${x.id} pid=${x.patientId} right=${html`<span className="pill p-normale">${x.exercices?.length||0} exos</span>`}><b>${pName(x.patientId)}</b><span>${x.objectif||"Séance kiné"}${x.duree?" · "+x.duree+" min":""}</span></${Row}>`)}</div>`}
      <div className="card"><div className="card-h"><span className="card-t">7 prochains jours</span></div>
        ${week.length===0?html`<div className="empty">Aucune échéance.</div>`:week.map((w,i)=>{const head=i===0||week[i-1].d!==w.d;return html`<${Fragment} key=${w.x.id}>${head&&html`<div className="mini-t" style=${{textTransform:"capitalize"}}>${dayLab(w.d)}</div>`}
          <${Row} pid=${w.x.patientId} right=${w.k==="rdv"?html`<span className="pill p-normale">RDV</span>`:html`<span className=${"pill "+prioCls(w.x.priorite)}>${w.x.priorite}</span>`}>
            <b>${w.k==="rdv"?`${w.x.type}${w.x.heure?" · "+w.x.heure:""}`:w.x.message}</b><span>${pName(w.x.patientId)}${w.k==="rdv"?` · ${w.x.pro||""} ${w.x.lieu||""}`:` · ${w.x.type}`}</span></${Row}></${Fragment}>`})}
      </div>
      ${noSeance.length>0&&html`<div className="card"><div className="card-h"><span className="card-t">Sans séance depuis plus de 10 jours</span></div>
        ${noSeance.map(({p,l,n})=>html`<${Row} key=${p.id} pid=${p.id} right=${html`<span className="mono warn-t">${n} j</span>`}><b>${fullName(p)}</b><span>${p.diagnostic||"—"} · ${l?"dernière séance "+fmtDs(l.date):"aucune séance depuis le début de PEC"}</span></${Row}>`)}</div>`}
      ${noBilan.length>0&&html`<div className="card"><div className="card-h"><span className="card-t">Bilan initial à réaliser</span></div>
        ${noBilan.map(p=>html`<${Row} key=${p.id} pid=${p.id}><b>${fullName(p)}</b><span>${p.diagnostic||"diagnostic non renseigné"} · PEC ${fmtDs(p.debutPEC)}</span></${Row}>`)}</div>`}
      ${unvalid.length>0&&html`<div className="card"><div className="card-h"><span className="card-t">Déficits à valider</span><span className="src">suggestions issues du dernier bilan</span></div>
        ${unvalid.map(({p,n})=>html`<${Row} key=${p.id} pid=${p.id} right=${html`<span className="pill p-normale">${n}</span>`}><b>${fullName(p)}</b><span>${n} suggestion${n>1?"s":""} en attente dans Déficits</span></${Row}>`)}</div>`}
      ${crit.length>0&&html`<div className="card accent-bar"><div className="card-h"><span className="card-t">Critères de progression atteints</span></div>
        ${crit.map(({p,ph,ev})=>html`<${Row} key=${p.id} pid=${p.id} right=${html`<span className="ok-t mono">${ev.ok}/${ev.total}</span>`}><b>${fullName(p)}</b><span>${ph.phase} ${ph.cycle||""} : tous les critères chiffrés sont atteints au dernier bilan — passage au cycle suivant à envisager</span></${Row}>`)}</div>`}
    </div>
  </div>`;
}

function applyTemplate(b,tplKey,db){
  const custom=(db.settings.bilanTemplates||[]).find(t=>t.id===tplKey);
  if(custom){const en={};secsOf(b.region,b.type).forEach(s=>en[s]=custom.enabled[s]!==undefined?custom.enabled[s]:true);return {...b,enabled:en,questList:custom.q||null,template:custom.l}}
  const T=BILAN_TEMPLATES[tplKey];if(!T||(T.region||"genou")!==(b.region||"genou"))return b;const off=Array.isArray(T.off)?T.off:(T.off[b.type]||[]);
  const en={};secsOf(b.region,b.type).forEach(s=>en[s]=s!=="fms"&&!off.includes(s)&&!((tplKey==="complet"||tplKey==="chComplet"||tplKey==="hComplet")&&defOffOf(b.region,b.type).includes(s)));
  return {...b,enabled:en,questList:T.q,template:T.l,...(T.muscle&&(b.type==="Initial"||!b.muscle)?{muscle:T.muscle}:{})};
}
function guessRegion(db,pid){
  const last=sortDate(byPatient(db.bilans,pid),"date",-1)[0];if(last&&REGIONS[last.region])return last.region;
  const p=db.patients.find(x=>x.id===pid);const d=normName((p?.diagnostic||"")+" "+(p?.motif||""));
  if(/lesion musc|elongation|dechirure|claquage|desinsertion|ischio|biceps femoral|semi-?tend|semi-?membr|droit femoral|jumeau|gastrocn|soleaire|tennis leg|bamic|contracture/.test(d))return "muscle";
  if(/hanche|coxo|\bcam\b|pincer|\bfai\b|conflit femoro|labr|pubalg|\baine\b|inguinal|trochant|glute|psoas|adduct|pubi/.test(d))return "hanche";
  return /cheville|achille|pied|fasci|aponevros|syndesm|malleol|talus|astragal|tibio-fibul|fibulaire|peronier|calcan|metatars/.test(d)?"cheville":"genou";
}
function guessTemplate(p,region){const d=normName((p?.diagnostic||"")+" "+(p?.motif||""));
  if(GUESS_TPL[region])return GUESS_TPL[region](d,p);
  if(region==="cheville"){if(/achille|achilleen/.test(d))return "chAchille";if(/syndesm|tibio-fibul|tibiofibul/.test(d))return "chSyndes";if(/instab/.test(d))return "chInstab";if(/fasci|aponevros/.test(d))return "chFascia";if(/entorse|ltfa|lcf|ligament/.test(d))return "chEntorse";return "chComplet"}
  if(/lca|croise ant|ligamentoplast|dt4|kj|droit interne/.test(d))return /plast|opere|dt4|kj|reconstr/.test(d)?"lca":"lcaNo";
  if(/lli|lle|collateral|lateral interne|lateral externe/.test(d))return "lli";if(/menisc/.test(d))return "menisque";if(/rotulien|patellaire.*tendin|tendin.*patell|tendin.*rotul/.test(d))return "tendRot";
  if(/femoro|sfp|rotul/.test(d))return "sfp";return "complet"}

/* ---------- Critères de progression chiffrés ---------- */
const CRIT_METRICS=()=>{const seen=new Set(),out=[];[...METRIC_GROUPS,...METRIC_GROUPS_CH,...ALL_GROUP_SETS.flatMap(f=>f())].forEach(([g,ms])=>ms.filter(m=>m[3]).forEach(m=>{if(seen.has(m[0]))return;seen.add(m[0]);out.push({k:m[0],l:m[1],u:m[2],better:m[3],g})}));return out};
function evalCrit(db,pid,ph,bilanOverride){
  const list=ph.critList||[];if(!list.length)return {rows:[],ok:0,total:0,bilan:null};
  const b=bilanOverride||sortDate(byPatient(db.bilans,pid).filter(x=>REGIONS[x.region]),"date",-1)[0];
  const v=b?metricVals(b,db.settings):{};const M=Object.fromEntries(CRIT_METRICS().map(m=>[m.k,m]));
  const rows=list.map(c=>{const m=M[c.k];const val=v[c.k];const target=num(c.v);let ok=null;if(typeof val==="number"&&target!==null)ok=c.op===">="?val>=target:val<=target;return {...c,m,val,ok}});
  const evald=rows.filter(r=>r.ok!==null);return {rows,ok:evald.filter(r=>r.ok).length,total:rows.length,bilan:b};
}
function CritEditor({list,set}){
  const ms=CRIT_METRICS();const groups=[...new Set(ms.map(m=>m.g))];
  const add=()=>set([...(list||[]),{k:"lsiQuad",op:">=",v:""}]);
  return html`<div>
    ${(list||[]).map((c,i)=>{const m=ms.find(x=>x.k===c.k);return html`<div key=${i} className="row" style=${{gap:6,marginBottom:6}}>
      <select className="inp" style=${{flex:1,minWidth:180,padding:"5px 7px"}} value=${c.k} onChange=${e=>{const nm=ms.find(x=>x.k===e.target.value);set(list.map((x,j)=>j===i?{...x,k:e.target.value,op:nm&&nm.better==="down"?"<=":">="}:x))}}>
        ${groups.map(g=>html`<optgroup key=${g} label=${g}>${ms.filter(x=>x.g===g).map(x=>html`<option key=${x.k} value=${x.k}>${x.l}</option>`)}</optgroup>`)}</select>
      <select className="inp" style=${{width:62,padding:"5px 7px"}} value=${c.op} onChange=${e=>set(list.map((x,j)=>j===i?{...x,op:e.target.value}:x))}><option value=">=">≥</option><option value="<=">≤</option></select>
      <${NumIn} v=${c.v} on=${v=>set(list.map((x,j)=>j===i?{...x,v}:x))} w=${64} unit=${m?.u||""}/>
      <button className="btn sm ghost" onClick=${()=>set(list.filter((_,j)=>j!==i))}><${Ico} n="x" s=${13}/></button></div>`})}
    <button className="btn sm" onClick=${add}><${Ico} n="plus" s=${13}/>Ajouter un critère chiffré</button>
  </div>`;
}
function CritStatus({db,pid,ph,bilan,compact}){
  const ev=evalCrit(db,pid,ph,bilan);if(!ev.total)return null;
  return html`<div>
    ${!compact&&html`<div className="sub" style=${{fontSize:11.5,marginBottom:4}}>${ev.bilan?`Évalués sur le bilan ${ev.bilan.type.toLowerCase()} du ${fmtDs(ev.bilan.date)}${bilan?" (en cours de saisie)":""}`:"Aucun bilan pour évaluer"} · ${ev.ok}/${ev.total} atteints</div>`}
    ${ev.rows.map((r,i)=>html`<div key=${i} className="row" style=${{gap:8,fontSize:13,padding:"2px 0"}}>
      <span style=${{width:16,textAlign:"center",fontWeight:800}} className=${r.ok===null?"sub":r.ok?"ok-t":"bad-t"}>${r.ok===null?"–":r.ok?"✓":"✗"}</span>
      <span>${r.m?.l||r.k} ${r.op===">="?"≥":"≤"} ${r.v}${r.m?.u||""}</span><span className="sub mono" style=${{marginLeft:"auto"}}>${typeof r.val==="number"?fmtN(r.val,1)+(r.m?.u||""):"n.é."}</span></div>`)}
  </div>`;
}

const DYN_GROUPS=[["quad","Quadriceps (extension)"],["ischio","Ischio-jambiers (flexion)"],["abdHanche","Abducteurs de hanche"],["addHanche","Adducteurs de hanche"]];
const DYN_RATIOS=[["hq","Ischio / Quadriceps (H/Q)","ischio","quad"],["aa","Adducteurs / Abducteurs","addHanche","abdHanche"]];
const DYN_GROUPS_CH=[["flexPlantaire","Fléchisseurs plantaires"],["flexDorsale","Fléchisseurs dorsaux"],["inversion","Inverseurs"],["eversion","Éverseurs"],["abdHanche","Abducteurs de hanche"]];
const DYN_RATIOS_CH=[["ei","Éverseurs / Inverseurs","eversion","inversion"],["dp","Fl. dorsaux / Fl. plantaires","flexDorsale","flexPlantaire"]];
function dynSides(cote){return cote==="G"?["G","D"]:["D","G"]}
function dynRatio(f,num_,den,side){const a=num(f?.[num_+"_"+side]),b=num(f?.[den+"_"+side]);return a!==null&&b?a/b:null}
function DynamoViz({f,cote,region,groups,ratios:ratiosIn}){
  const [L,S]=dynSides(cote);const unit=f?.unit||"N";const GR=groups||(region==="cheville"?DYN_GROUPS_CH:DYN_GROUPS),RA=ratiosIn||(region==="cheville"?DYN_RATIOS_CH:DYN_RATIOS);
  const rows=GR.map(([k,l])=>({k,l,a:num(f?.[k+"_"+L]),b:num(f?.[k+"_"+S])})).filter(r=>r.a!==null||r.b!==null);
  if(!rows.length)return null;
  const max=Math.max(...rows.flatMap(r=>[r.a||0,r.b||0]),1);const W=560,lw=170,bw=W-lw-90,rh=34;
  const lab=cote==="B"?["Droit","Gauche"]:["Lésé","Sain"];
  const ratios=RA.map(([k,l,n,d])=>({k,l,les:dynRatio(f,n,d,L),sain:dynRatio(f,n,d,S)})).filter(r=>r.les!==null||r.sain!==null);
  return html`<div style=${{marginTop:14}}>
    <div className="mini-t" style=${{marginTop:0}}>Gauche / droite</div>
    <svg viewBox=${`0 0 ${W} ${rows.length*rh+8}`} width="100%" style=${{maxWidth:W,display:"block"}}>
      ${rows.map((r,i)=>{const y=i*rh+4;const l=r.a!==null&&r.b?r.a/r.b*100:null;const c=l===null?"#A9A69B":l>=90?"#2F7D4F":l>=80?"#B26A00":"#B23A2E";
        return html`<g key=${r.k}><text x="0" y=${y+15} fontSize="11.5" fontWeight="600" fill="#3A3A3E">${r.l}</text>
          ${r.a!==null&&html`<rect x=${lw} y=${y+2} width=${r.a/max*bw} height="11" rx="2" fill="#E0AE14"><title>${lab[0]} : ${fmtN(r.a,1)} ${unit}</title></rect>`}
          ${r.b!==null&&html`<rect x=${lw} y=${y+15} width=${r.b/max*bw} height="11" rx="2" fill="#C9C6BB"><title>${lab[1]} : ${fmtN(r.b,1)} ${unit}</title></rect>`}
          ${r.a!==null&&html`<text x=${lw+r.a/max*bw+4} y=${y+11} fontSize="9.5" fill="#3A3A3E">${fmtN(r.a,0)}</text>`}
          ${r.b!==null&&html`<text x=${lw+r.b/max*bw+4} y=${y+24} fontSize="9.5" fill="#7A786F">${fmtN(r.b,0)}</text>`}
          <text x=${W} y=${y+18} textAnchor="end" fontSize="12" fontWeight="800" fill=${c}>${l===null?"—":"LSI "+fmtN(l,0)+" %"}</text></g>`})}
    </svg>
    <div className="legend" style=${{marginTop:2}}><span><i style=${{background:"#E0AE14",height:8}}></i>${lab[0]}</span><span><i style=${{background:"#C9C6BB",height:8}}></i>${lab[1]}</span><span className="sub">valeurs en ${unit}</span></div>
    ${ratios.length>0&&html`<div className="mini-t">Agoniste / antagoniste</div>
      <table style=${{fontSize:13}}><thead><tr><th>Ratio</th><th style=${{textAlign:"right"}}>${lab[0]}</th><th style=${{textAlign:"right"}}>${lab[1]}</th><th style=${{textAlign:"right"}}>Écart ${lab[0].toLowerCase()} vs ${lab[1].toLowerCase()}</th></tr></thead>
      <tbody>${ratios.map(r=>{const e=r.les!==null&&r.sain?(r.les/r.sain-1)*100:null;return html`<tr key=${r.k}><td>${r.l}</td><td className="mono" style=${{textAlign:"right",fontWeight:700}}>${r.les===null?"—":r.les.toFixed(2)}</td><td className="mono" style=${{textAlign:"right"}}>${r.sain===null?"—":r.sain.toFixed(2)}</td>
        <td className=${"mono "+(e===null?"sub":Math.abs(e)<=10?"ok-t":Math.abs(e)<=20?"warn-t":"bad-t")} style=${{textAlign:"right"}}>${e===null?"—":(e>0?"+":"")+fmtN(e,0)+" %"}</td></tr>`})}</tbody></table>
      <div className="sub" style=${{fontSize:11.5,marginTop:4}}>Les valeurs normatives des ratios dépendent de la position et du mode de test : la référence utilisée ici est le côté sain du patient.</div>`}
  </div>`;
}

function seanceFromSource(db,pid,src){
  if(!src)return null;

  if(src==="last"){const l=sortDate(byPatient(db.seances,pid).filter(x=>(!x.type||x.type==="Kiné")&&!isPlanned(x)),"date",-1)[0];return l?{objectif:l.objectif||"",duree:l.duree||"",blocMeta:l.blocMeta?JSON.parse(JSON.stringify(l.blocMeta)):null,exercices:JSON.parse(JSON.stringify(l.exercices||[]))}:null}
  if(src==="prog"){const p=byPatient(db.programmes,pid).find(x=>x.statut==="Actif");return p?{objectif:p.objectif||"",duree:"",exercices:(p.exercices||[]).map(e=>({nom:e.nom,exId:e.exId||null,series:e.series||"",reps:e.reps||"",charge:e.charge||"",tempo:e.tempo||"",notes:e.notes||"",bloc:"Principal"}))}:null}
  return null;
}

function calIndex(db,pid){
  const phases=sortDate(byPatient(db.phases,pid),"debut");const phCol=Object.fromEntries(phases.map((p,i)=>[p.id,PH_COLORS[i%PH_COLORS.length]]));
  const by={};const add=(k,t,x)=>{(by[k]=by[k]||{se:[],rdv:[],al:[]})[t].push(x)};
  byPatient(db.seances,pid).forEach(x=>add(x.date,"se",x));byPatient(db.rdv,pid).filter(r=>r.statut!=="Annulé").forEach(r=>add(r.date,"rdv",r));
  byPatient(db.alertes,pid).filter(a=>a.statut==="À faire"||a.statut==="En cours").forEach(a=>add(a.echeance,"al",a));
  const phaseOf=k=>phases.find(p=>p.debut&&p.debut<=k&&(!p.fin||p.fin>=k));
  return {by,phases,phCol,phaseOf};
}

const HIP_AMPL=[["hFlexP","Flexion","°"],["hExtP","Extension","°"],["hAbdP","Abduction","°"],["hAddP","Adduction","°"],["hRIP","Rotation interne (hanche à 90°)","°"],["hREP","Rotation externe (hanche à 90°)","°"]];

const HIP_PALP=[["adducteurs","Insertion des adducteurs"],["iliopsoas","Iliopsoas"],["inguinal","Canal inguinal"],["symphyse","Symphyse pubienne"],["trochanter","Grand trochanter"]];

// Suggestions d'entités (définitions de Doha 2015) — l'utilisateur garde la classification.
function dohaSuggest(b){
  const ins=b.inspection||{},t=b.tests||{};const out=[];const sides=b.cote==="B"?["G","D"]:[b.cote==="G"?"G":"D"];
  const pal=z=>sides.some(sd=>ins[`p_${z}_${sd}`]==="Oui");const pos=k=>sides.some(sd=>t[`${k}_${sd}`]==="Positif");
  if(pal("adducteurs")&&pos("addRes"))out.push(["Adducteurs","sensibilité des adducteurs + douleur à l'adduction résistée"]);
  if(pal("iliopsoas"))out.push(["Iliopsoas",pos("flexRes")||pos("flexStretch")?"sensibilité de l'iliopsoas + flexion résistée et/ou étirement douloureux":"sensibilité de l'iliopsoas (plus probable si flexion résistée ou étirement douloureux)"]);
  if(pal("inguinal"))out.push(["Inguinal",pos("abdoRes")?"sensibilité du canal inguinal + douleur aux abdominaux résistés / Valsalva":"sensibilité du canal inguinal (sans hernie palpable)"]);
  if(pal("symphyse"))out.push(["Pubien","sensibilité locale de la symphyse et de l'os adjacent"]);
  if(sides.some(sd=>t[`sls30_${sd}`]==="Positif"))out.push(["Tendinopathie glutéale / GTPS","appui unipodal 30 s positif (spécificité élevée, Grimaldi 2017)"]);
  return out;
}
function hipMobility(b){
  const m=b.mobilite||{},L=b.cote;if(!L||L==="B")return {score:null,ratios:{}};const S=otherSide(L);
  const ratios={},defs={};
  HIP_AMPL.forEach(([k])=>{const a=num(m[`${k}_${L}`]),r=num(m[`${k}_${S}`]);if(a!==null&&r!==null){defs[k]=Math.max(0,r-a);ratios[k]=r>0?Math.min(100,Math.max(0,a)/r*100):(a>=r?100:null)}});
  const dk=Object.keys(defs);const defMax=dk.length?Math.max(...dk.map(k=>defs[k])):null;const defKey=dk.length?dk.reduce((x,y)=>defs[y]>defs[x]?y:x):null;
  const sc=mean(Object.values(ratios));return {score:sc===null?null:clamp(sc),ratios,defs,defMax,defKey};
}

  return html`<table style=${{fontSize:13}}><${LRHead} cols=${cols} extra=${ex}/><tbody>
    ${rows.map(([k,l,u,inv])=>{const a=num(g(`${base}.${k}_${L}`)),b=num(g(`${base}.${k}_${Sn}`));let cell="—",cls="";
      if(a!==null&&b!==null){if(calc==="diff"){const dd=a-b;cell=(dd>0?"+":"")+fmtN(dd,1)+" "+(u||"");cls=(inv?dd>0:dd<0)?"warn-t":""}else{const v=inv?(a?b/a*100:null):(b?a/b*100:null);cell=v===null?"—":fmtN(v)+" %";cls=lsiCls(v)}}
      return html`<tr key=${k}><td>${l}</td>${cols.map(c=>html`<td key=${c.k}><${NumIn} v=${g(`${base}.${k}_${c.k}`)} on=${v=>s(`${base}.${k}_${c.k}`,v)} unit=${u||""} w=${62}/>${init&&c.k===L&&html`<${Prev} v=${getP(init,`${base}.${k}_${c.k}`)}/>`}</td>`)}
        <td><${Calc} cls=${"mono "+cls}>${cell}</${Calc}></td>
        ${pain&&html`<td>${pain==="num"?html`<${NumIn} v=${g(`${base}.${k}_dlr`)} on=${v=>s(`${base}.${k}_dlr`,v)} unit="/10" w=${48}/>`:html`<${Sel} v=${g(`${base}.${k}_dlr`)} on=${v=>s(`${base}.${k}_dlr`,v)} opts=${["","Non","Oui"]} w=${80}/>`}</td>`}</tr>`})}

function regionPanels(comp,ser,clean){
  const hc=comp.filter(x=>x.b.region==="hanche"),mc=comp.filter(x=>x.b.region==="muscle");const out=[];
  if(hc.length){
    out.push({t:"Hanche — force LSI (%)",s:clean(HIP_DYN.map(([k,l])=>ser(l.split(" (")[0],x=>x.v?.["lsi_"+k],hc))),o:{yMin:0,yMax:110},refs:[{v:90,label:"90 %"}],unit:" %"});
    out.push({t:"Hanche — amplitudes côté lésé (°)",s:clean(HIP_AMPL.map(([k,l])=>ser(l.split(" (")[0],x=>x.v?.[k+"L"],hc))),o:{}});
    out.push({t:"Hanche — ratio adducteurs / abducteurs",s:clean([ser("Lésé",x=>x.v?.aaLes,hc,{color:"#B23A2E"}),ser("Sain",x=>x.v?.aaSain,hc,{color:"#B23A2E",dash:"4 3"})]),o:{yMin:0},refs:[{v:0.9,label:"0,90"}]});
    out.push({t:"Hanche — HAGOS (/100)",s:clean(HAGOS_M.map(([k,l])=>ser(l.replace("HAGOS ",""),x=>x.v?.[k],hc))),o:{yMin:0,yMax:100}});
  }
  if(mc.length){
    const keys=[...new Set(mc.flatMap(x=>Object.keys(x.v||{})))];
    const lab=k=>{for(const x of mc){const m=metricsOf("muscle",x.b.muscle).find(z=>z[0]===k);if(m)return m[1]}return k};
    out.push({t:"Lésion musculaire — LSI (%)",s:clean(keys.filter(k=>/^lsi[SFE]_/.test(k)).map(k=>ser(lab(k),x=>x.v?.[k],mc))),o:{yMin:0,yMax:110},refs:[{v:90,label:"90 %"}],unit:" %"});
    out.push({t:"Lésion musculaire — douleur aux tests (/10)",s:clean([ser("Palpation",x=>x.v?.palpEva,mc),...keys.filter(k=>/^dlrF_/.test(k)).map(k=>ser(lab(k).replace("Douleur · ",""),x=>x.v?.[k],mc))]),o:{yMin:0,yMax:10}});
    out.push({t:"Lésion musculaire — Vmax (% pré-blessure)",s:clean([ser("Vmax",x=>x.v?.vmaxPct,mc)]),o:{yMin:0,yMax:110},refs:[{v:95,label:"95 %"}],unit:" %"});
  }
  return out;
}

const FMS_ITEMS=[["deepSquat","Deep squat",false],["hurdle","Hurdle step",true],["lunge","Inline lunge",true],["shoulder","Shoulder mobility",true],["aslr","Active straight leg raise",true],["pushup","Trunk stability push-up",false],["rotary","Rotary stability",true]];
const FMS_CLEAR=[["clrShoulder","Dégagement épaule (douleur)","shoulder"],["clrExt","Dégagement extension rachis (douleur)","pushup"],["clrFlex","Dégagement flexion rachis (douleur)","rotary"]];
function fmsCalc(f){
  f=f||{};const items={};const asym=[];let n=0;
  FMS_ITEMS.forEach(([k,l,bi])=>{let v=null;
    if(bi){const g=num(f[k+"_G"]),dd=num(f[k+"_D"]);if(g!==null&&dd!==null){v=Math.min(g,dd);if(g!==dd)asym.push(`${l} (G ${g} / D ${dd})`)}else v=g!==null?g:dd}
    else v=num(f[k]);
    const cl=FMS_CLEAR.find(c=>c[2]===k);if(cl&&f[cl[0]]==="Oui"&&v!==null)v=0;
    items[k]=v;if(v!==null)n++});
  const pain=FMS_CLEAR.filter(([k])=>f[k]==="Oui").map(([,l])=>l.replace(" (douleur)",""));
  const zeros=FMS_ITEMS.filter(([k])=>items[k]===0).map(([,l])=>l);
  const total=n===FMS_ITEMS.length?Object.values(items).reduce((a,b)=>a+b,0):null;
  return {items,total,n,asym,pain,zeros};
}

function App({vault}={}){
