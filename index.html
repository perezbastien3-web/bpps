  const [view,setView]=useState("today");
  const [pid,setPid]=useState(()=>{const d=vault?vault.initial:(migrate(storage.load())||seed());return (d.patients.find(p=>p.statut==="Actif")||d.patients[0]||{}).id||""});
  const [saved,setSaved]=useState(true);const [bilSub,setBilSub]=useState(null);const [seSub,setSeSub]=useState(null);const [menu,setMenu]=useState(false);
  useEffect(()=>{setBilSub(null)},[pid]);const [toastMsg,setToastMsg]=useState("");const [newOpen,setNewOpen]=useState(false);
  const tRef=useRef();
  const toast=m=>{setToastMsg(m);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToastMsg(""),2200)};
  useEffect(()=>{setSaved(false);const t=setTimeout(()=>{if(vault)vault.persist(db).then(ok=>setSaved(ok));else setSaved(storage.save(db))},250);return()=>clearTimeout(t)},[db]);
  useEffect(()=>{if(pid&&!db.patients.find(p=>p.id===pid)){setPid(db.patients[0]?.id||"");if(!db.patients.length)setView("patients")}},[db.patients]);
  useEffect(()=>{if(!pid&&view!=="patients"&&view!=="params"&&view!=="biblio"&&view!=="today")setView("patients")},[pid,view]);
  const setDb=d=>setDbRaw(d);
  const logEntry=(pidx,msg)=>({at:nowISO(),pid:pidx,msg});
  const act={
    updatePatient(id,ch,msg){setDbRaw(d=>({...d,patients:d.patients.map(p=>p.id===id?{...p,...ch,updatedAt:nowISO()}:p),audit:[...d.audit,logEntry(id,msg||"Modification")]}))},
    createPatient(data){let id;setDbRaw(d=>{const n=(d.counters.P||0)+1;id="P-"+pad(n);const p={id,nom:"",prenom:"",dob:"",sexe:"",tel:"",email:"",profession:"",sport:"",niveau:"",poste:"",dominance:"",entrainements:"",volume:"",objectifSportif:"",motif:"",diagnostic:"",cote:"",dateBlessure:"",dateChirurgie:"",debutPEC:"",medecin:"",chirurgien:"",objectifsPatient:"",objectifsTherapeutiques:"",atcdMedicaux:"",atcdChirurgicaux:"",atcdSportifs:"",traitements:"",notes:"",liensDocs:"",...data,statut:"Actif",createdAt:nowISO()};
      return {...d,counters:{...d.counters,P:n},patients:[...d.patients,p],audit:[...d.audit,logEntry(id,"Création du patient")]}});return ()=>id},
    deletePatient(id){db.documents.filter(x=>x.patientId===id&&x.file).forEach(x=>fileStore.del(x.file.id).catch(()=>{}));setDbRaw(d=>{const f=a=>a.filter(x=>x.patientId!==id);return {...d,patients:d.patients.filter(p=>p.id!==id),bilans:f(d.bilans),deficits:f(d.deficits),phases:f(d.phases),seances:f(d.seances),rdv:f(d.rdv),alertes:f(d.alertes),programmes:f(d.programmes),documents:f(d.documents),audit:[...d.audit,logEntry(id,"Suppression du patient et de son dossier")]}})},
    saveBilan(b){let id=b.id;const isNew=!id;let nid;setDbRaw(d=>{let c=d.counters;if(isNew){const n=(c.B||0)+1;nid="B-"+pad(n);c={...c,B:n}}else nid=id;const rec={...b,id:nid,updatedAt:nowISO()};
      return {...d,counters:c,bilans:isNew?[...d.bilans,rec]:d.bilans.map(x=>x.id===nid?rec:x),audit:[...d.audit,logEntry(b.patientId,(isNew?"Création":"Modification")+" du bilan "+nid+" ("+b.type+")")]}});
      if(isNew){const n=(db.counters.B||0)+1;return "B-"+pad(n)}return id},
    deleteBilan(id){setDbRaw(d=>{const b=d.bilans.find(x=>x.id===id);return {...d,bilans:d.bilans.filter(x=>x.id!==id),audit:[...d.audit,logEntry(b?.patientId,"Suppression du bilan "+id)]}})},
    saveDeficit(x){const isNew=!x.id;let id=x.id;if(isNew)id="D-"+pad((db.counters.D||0)+1);
      setDbRaw(d=>{let c=d.counters;let nid=x.id;if(isNew){const n=(c.D||0)+1;nid="D-"+pad(n);c={...c,D:n}}
        const prev=d.deficits.find(y=>y.id===nid);const changed=!prev||prev.valeur!==x.valeur||prev.statut!==x.statut||prev.priorite!==x.priorite;
        const hist=[...(prev?.historique||x.historique||[])];if(changed)hist.push({date:todayISO(),valeur:x.valeur,statut:x.statut,priorite:x.priorite});
        const rec={...x,id:nid,maj:changed?todayISO():(prev?.maj||todayISO()),historique:hist};
        return {...d,counters:c,deficits:isNew?[...d.deficits,rec]:d.deficits.map(y=>y.id===nid?rec:y),audit:[...d.audit,logEntry(x.patientId,(isNew?"Création":"Modification")+" du déficit "+nid+(prev&&prev.statut!==x.statut?` (statut → ${x.statut})`:""))]}});return id},
    deleteDeficit(id){setDbRaw(d=>{const x=d.deficits.find(y=>y.id===id);return {...d,deficits:d.deficits.filter(y=>y.id!==id),phases:d.phases.map(p=>({...p,deficits:(p.deficits||[]).filter(z=>z!==id)})),audit:[...d.audit,logEntry(x?.patientId,"Suppression du déficit "+id)]}})},
    savePhase(x){const isNew=!x.id;let id=x.id;if(isNew)id="PH-"+pad((db.counters.PH||0)+1);
      setDbRaw(d=>{let c=d.counters;let nid=x.id;if(isNew){const n=(c.PH||0)+1;nid="PH-"+pad(n);c={...c,PH:n}}const rec={...x,id:nid,updatedAt:nowISO()};
        return syncPhaseAlert({...d,counters:c,phases:isNew?[...d.phases,rec]:d.phases.map(y=>y.id===nid?rec:y),audit:[...d.audit,logEntry(x.patientId,(isNew?"Création":"Modification")+" de la phase "+nid+" ("+x.phase+" "+(x.cycle||"")+")")]},rec)});return id},
    deletePhase(id){setDbRaw(d=>{const x=d.phases.find(y=>y.id===id);const nd={...d,phases:d.phases.filter(y=>y.id!==id),audit:[...d.audit,logEntry(x?.patientId,"Suppression de la phase "+id)]};return x?syncPhaseAlert(nd,x,true):nd})},
    dismiss(tag){setDbRaw(d=>({...d,dismissed:[...(d.dismissed||[]),tag]}))},
    saveSeance(x){const isNew=!x.id;const id=isNew?"S-"+pad((db.counters.S||0)+1):x.id;
      setDbRaw(d=>{let c=d.counters;if(isNew)c={...c,S:(c.S||0)+1};const rec={...x,id,updatedAt:nowISO()};return {...d,counters:c,seances:isNew?[...d.seances,rec]:d.seances.map(y=>y.id===id?rec:y),audit:[...d.audit,logEntry(x.patientId,(isNew?"Création":"Modification")+" de la séance "+id)]}});return id},
    deleteSeance(id){setDbRaw(d=>{const x=d.seances.find(y=>y.id===id);return {...d,seances:d.seances.filter(y=>y.id!==id),audit:[...d.audit,logEntry(x?.patientId,"Suppression de la séance "+id)]}})},
    saveProgramme(x){const isNew=!x.id;const id=isNew?"PR-"+pad((db.counters.PR||0)+1):x.id;const prev=db.programmes.find(y=>y.id===id);
      const versions=[...(prev?.versions||[])];if(prev){const snap={version:prev.version||1,savedAt:prev.updatedAt||nowISO()};PR_FIELDS.forEach(k=>snap[k]=JSON.parse(JSON.stringify(prev[k]??"")));versions.push(snap)}
      const {_x,...clean}=x;const rec={...clean,id,version:prev?(prev.version||1)+1:1,versions,updatedAt:nowISO()};
      setDbRaw(d=>{let c=d.counters;if(isNew)c={...c,PR:(c.PR||0)+1};return {...d,counters:c,programmes:isNew?[...d.programmes,rec]:d.programmes.map(y=>y.id===id?rec:y),audit:[...d.audit,logEntry(x.patientId,(isNew?"Création":"Nouvelle version")+" du programme "+id+" (v"+rec.version+")")]}});return rec},
    deleteProgramme(id){setDbRaw(d=>{const x=d.programmes.find(y=>y.id===id);return {...d,programmes:d.programmes.filter(y=>y.id!==id),audit:[...d.audit,logEntry(x?.patientId,"Suppression du programme "+id)]}})},
    saveExercise(e){setDbRaw(d=>{let c=d.counters;let id=e.id;if(!id){c={...c,EX:(c.EX||0)+1};id="EX-"+pad(c.EX)}const {_chain,_pos,...rec}={...e,id};
      let ex=e.id?d.exercices.map(y=>y.id===id?rec:y):[...d.exercices,rec];
      let ch=d.chaines;if(_chain){ch=ch.map(k=>{if(k.id!==_chain||k.items.includes(id))return k;const it=[...k.items];const p=num(_pos);const at=p===null?it.length:Math.max(0,Math.min(it.length,p-1));it.splice(at,0,id);return {...k,items:it}})}
      return {...d,counters:c,exercices:ex,chaines:ch,audit:[...d.audit,logEntry(null,(e.id?"Modification":"Ajout")+" de l'exercice "+rec.nom)]}})},
    saveChain(k){setDbRaw(d=>{const n=(d.counters.CH||0)+1;return {...d,counters:{...d.counters,CH:n},chaines:[...d.chaines,{id:"CH-"+pad(n,3),articulation:k.articulation,label:k.label,items:[]}],audit:[...d.audit,logEntry(null,"Création de la chaîne "+k.label)]}})},
    moveInChain(cid,i,dir){setDbRaw(d=>({...d,chaines:d.chaines.map(k=>{if(k.id!==cid)return k;const it=[...k.items];const j=i+dir;if(j<0||j>=it.length)return k;[it[i],it[j]]=[it[j],it[i]];return {...k,items:it}})}))},
    removeFromChain(cid,i){setDbRaw(d=>({...d,chaines:d.chaines.map(k=>k.id!==cid?k:{...k,items:k.items.filter((_,j)=>j!==i)})}))},
    setQLabel(q,id,t){setDbRaw(d=>{const L={...(d.settings.qLabels||{})};L[q]={...(L[q]||{}),[id]:t};return {...d,settings:{...d.settings,qLabels:L}}})},
    saveRec(coll,x){const P={rdv:["R","R"],alertes:["A","A"],documents:["DOC","DOC"]}[coll];const isNew=!x.id;const id=isNew?P[0]+"-"+pad((db.counters[P[1]]||0)+1):x.id;
      setDbRaw(d=>{let c=d.counters;if(isNew)c={...c,[P[1]]:(c[P[1]]||0)+1};const rec={...x,id,updatedAt:nowISO()};const lab={rdv:"rendez-vous",alertes:"alerte",documents:"document"}[coll];
        return {...d,counters:c,[coll]:isNew?[...d[coll],rec]:d[coll].map(y=>y.id===id?rec:y),audit:[...d.audit,logEntry(x.patientId,(isNew?"Création":"Modification")+` ${lab} ${id}`)]}});return id},
    delRec(coll,id){setDbRaw(d=>{const x=d[coll].find(y=>y.id===id);return {...d,[coll]:d[coll].filter(y=>y.id!==id),audit:[...d.audit,logEntry(x?.patientId,"Suppression "+id)]}})},
    saveTemplate(t){setDbRaw(d=>({...d,settings:{...d.settings,bilanTemplates:[...(d.settings.bilanTemplates||[]),t]},audit:[...d.audit,logEntry(null,"Nouveau modèle de bilan : "+t.l)]}))},
    saveSeancesBulk(list){setDbRaw(d=>{let n=d.counters.S||0;const recs=list.map(x=>{n++;return {...x,id:"S-"+pad(n),updatedAt:nowISO()}});return {...d,counters:{...d.counters,S:n},seances:[...d.seances,...recs],audit:[...d.audit,logEntry(list[0]?.patientId,`Planification de ${recs.length} séance(s)`)]}})},
    saveSeanceTemplate(t){setDbRaw(d=>({...d,seanceTemplates:[...(d.seanceTemplates||[]),t],audit:[...d.audit,logEntry(null,"Nouveau modèle de séance : "+t.nom)]}))},
    setSettings(S){setDbRaw(d=>({...d,settings:S,audit:[...d.audit,logEntry(null,"Paramètres de calcul modifiés")]}))},
    log(msg){setDbRaw(d=>({...d,audit:[...d.audit,logEntry(null,msg)]}))}
  };
  const p=db.patients.find(x=>x.id===pid);
  const openPatient=id=>{setPid(id);setView("dashboard")};
  const onCreate=data=>{
    const n=(db.counters.P||0)+1;const id="P-"+pad(n);
    act.createPatient(data);setNewOpen(false);setPid(id);setView("fiche");toast(`Patient ${id} créé`);
  };
  const isPatientView=NAV_PATIENT.some(n=>n[0]===view);
  useEffect(()=>{if(view!=="bilans")setBilSub(null)},[view]);
  const go=v=>{setView(v);setMenu(false)};
  const openSeance=init=>{setSeSub({k:Date.now(),init});setView("seances");setMenu(false)};
  useEffect(()=>{if(view!=="seances")setSeSub(null)},[view]);
  const startBilan=type=>{const rg=guessRegion(db,pid);setBilSub({draft:applyTemplate(blankBilan(db,pid,type,rg),guessTemplate(db.patients.find(x=>x.id===pid),rg),db),n:Date.now()});setView("bilans");setMenu(false)};
  let body;
  if(view==="today")body=html`<${TodayView} db=${db} act=${act} toast=${toast} openPatient=${openPatient}/>`;
  else if(view==="patients")body=html`<${PatientsView} db=${db} act=${act} openPatient=${openPatient} openNew=${()=>setNewOpen(true)}/>`;
  else if(view==="params")body=html`<${ParamsView} db=${db} act=${act} toast=${toast} setDb=${setDb} vault=${vault}/>`;
  else if(view==="biblio")body=html`<${LibraryView} db=${db} act=${act} toast=${toast}/>`;
  else if(!p)body=html`<div className="empty">Sélectionnez un patient.</div>`;
  else if(view==="dashboard")body=html`<${DashboardView} key=${pid} db=${db} pid=${pid} setView=${setView} startBilan=${startBilan} toast=${toast}/>`;
  else if(view==="bilans")body=html`<${BilansView} db=${db} pid=${pid} act=${act} toast=${toast} setView=${setView} sub=${bilSub} setSub=${setBilSub}/>`;
  else if(view==="deficits")body=html`<${DeficitsView} db=${db} pid=${pid} act=${act} toast=${toast}/>`;
  else if(view==="planif")body=html`<${PlanifView} db=${db} pid=${pid} act=${act} toast=${toast} openSeance=${openSeance}/>`;
  else if(view==="graphs")body=html`<${GraphsView} key=${pid} db=${db} pid=${pid}/>`;
  else if(view==="bodychart")body=html`<${BodyChartView} key=${pid} db=${db} pid=${pid} openBilan=${id=>{setBilSub({id});setView("bilans")}}/>`;
  else if(view==="rdv")body=html`<${RdvView} key=${pid} db=${db} pid=${pid} act=${act} toast=${toast}/>`;
  else if(view==="alertes")body=html`<${AlertesView} key=${pid} db=${db} pid=${pid} act=${act} toast=${toast}/>`;
  else if(view==="documents")body=html`<${DocumentsView} key=${pid} db=${db} pid=${pid} act=${act} toast=${toast} vault=${vault}/>`;
  else if(view==="seances")body=html`<${SeancesView} key=${pid+(seSub?seSub.k:"")} db=${db} pid=${pid} act=${act} toast=${toast} ext=${seSub}/>`;
  else if(view==="programmes")body=html`<${ProgrammesView} db=${db} pid=${pid} act=${act} toast=${toast}/>`;
  else if(view==="fiche")body=html`<${FicheView} key=${pid} db=${db} pid=${pid} act=${act} setView=${setView} toast=${toast} startBilan=${startBilan}/>`;
  else body=html`<${ComingView} db=${db} pid=${pid} view=${view}/>`;
  return html`<div className=${"app"+(menu?" menu-open":"")}>
    <${Sidebar} db=${db} view=${view} setView=${go} pid=${pid} setPid=${id=>{setPid(id);setMenu(false)}} saved=${saved} vault=${vault}/>
    ${menu&&html`<div className="mob-ov" onClick=${()=>setMenu(false)}></div>`}
    <main className="main">
      <div className="topbar">
        <button className="btn mob-only" style=${{padding:"7px 9px"}} aria-label="Menu" onClick=${()=>setMenu(true)}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div style=${{minWidth:0}}><div className="crumbs">${isPatientView&&p?`${p.id} · ${fullName(p)}`:"BP PhysioSport Suite"}</div><h1 className="title">${VIEW_TITLES[view]||""}</h1></div>
        <div className="grow"></div>
        ${isPatientView&&p&&view!=="dashboard"&&html`<button className="btn desk-only" onClick=${()=>setView("dashboard")}><${Ico} n="dash" s=${15}/>Dashboard</button>`}
        <button className="btn desk-only" onClick=${()=>setView("patients")}><${Ico} n="users" s=${15}/>Patients</button>
        <button className="btn yellow" onClick=${()=>setNewOpen(true)}><${Ico} n="plus" s=${15} w=${2.2}/>Patient</button>
      </div>
      ${html`<div className="mtabs">${[["today","Aujourd'hui"],["patients","Patients"],...(p?NAV_PATIENT.filter(n=>!n[3]).map(n=>[n[0],n[1]]):[])].map(([k,l])=>html`<button key=${k} className=${"btn sm"+(view===k?" primary":"")} onClick=${()=>go(k)}>${l}</button>`)}</div>`}
      <div className="content">
        ${vault&&vault.auto&&(vault.auto.state==="paused"||vault.auto.state==="error")&&html`<div className="banner warn"><${Ico} n="info"/>${vault.auto.state==="paused"?"Sauvegarde automatique en pause : le navigateur demande de réautoriser l'accès au dossier.":vault.auto.msg}<div className="spacer"></div><button className="btn sm" onClick=${async()=>{if(await vault.resumeAuto())toast("Sauvegarde automatique réactivée")}}>Réactiver</button></div>`}
        ${vault&&db.patients.length>0&&(!vault.lastBackup||daysBetween(new Date(vault.lastBackup),new Date())>7)&&view!=="params"&&html`<div className="banner warn"><${Ico} n="info"/>${vault.lastBackup?"Dernière sauvegarde chiffrée il y a plus de 7 jours.":"Aucune sauvegarde chiffrée téléchargée."}<div className="spacer"></div><button className="btn sm" onClick=${async()=>{if(await vault.backup())toast("Sauvegarde chiffrée téléchargée")}}>Sauvegarder maintenant</button></div>`}
        ${!storage.ok&&html`<div className="banner warn"><${Ico} n="info"/>Stockage local indisponible : les données seront perdues à la fermeture. Utilisez l'export JSON (Paramètres).</div>`}
        ${body}
      </div>
    </main>
    ${newOpen&&html`<${NewPatientModal} onClose=${()=>setNewOpen(false)} onCreate=${onCreate}/>`}
    ${toastMsg&&html`<div className="toast">${toastMsg}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(SECURE?html`<${VaultGate}/>`:html`<${App}/>`);
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
